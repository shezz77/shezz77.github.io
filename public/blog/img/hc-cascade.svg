<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Two rows of six tasks each, both depending on a Redis cache that has gone down. In the top row the readiness check queries Redis, so all six tasks report unhealthy at once, the orchestrator removes and replaces every one of them, and a degraded cache becomes a total outage. In the bottom row the check ignores the cache because the cache is a soft dependency, so all six tasks stay in service and serve slower responses from the database until Redis returns.">
  <defs>
    <marker id="cA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8578"/>
    </marker>
  </defs>
  <style>
    .wave { animation: wave 5s ease-in-out infinite; opacity: 0; }
    .w1{animation-delay:.15s} .w2{animation-delay:.3s} .w3{animation-delay:.45s}
    .w4{animation-delay:.6s} .w5{animation-delay:.75s} .w6{animation-delay:.9s}
    @keyframes wave { 0%,10%{opacity:0} 22%,86%{opacity:1} 96%,100%{opacity:0} }
    .down { animation: down 5s ease-in-out infinite; }
    @keyframes down { 0%,6%{opacity:.25} 14%,90%{opacity:1} 98%,100%{opacity:.25} }
    @media (prefers-reduced-motion: reduce) {
      .wave { animation: none; opacity: 1; }
      .down { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="480" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">CHECKING TOO MUCH TURNS ONE OUTAGE INTO THREE</text>

    <g class="down">
      <rect x="30" y="180" width="150" height="92" fill="#F6E9E4" stroke="#BF3B24" stroke-width="3"/>
      <text x="105" y="212" text-anchor="middle" fill="#1B1712" font-size="13">redis</text>
      <text x="105" y="234" text-anchor="middle" fill="#BF3B24" font-size="11.5">unreachable</text>
      <text x="105" y="254" text-anchor="middle" fill="#5A5449" font-size="11">a cache, 90s blip</text>
    </g>

    <text x="300" y="82" fill="#5A5449" font-size="12">readiness queries redis &#8212; redis is treated as required</text>
      <rect x="300" y="96" width="60" height="46" fill="#F6E9E4" stroke="#BF3B24" stroke-width="2"/>
      <text x="330" y="125" text-anchor="middle" fill="#5A5449" font-size="11">t1</text>
      <rect x="374" y="96" width="60" height="46" fill="#F6E9E4" stroke="#BF3B24" stroke-width="2"/>
      <text x="404" y="125" text-anchor="middle" fill="#5A5449" font-size="11">t2</text>
      <rect x="448" y="96" width="60" height="46" fill="#F6E9E4" stroke="#BF3B24" stroke-width="2"/>
      <text x="478" y="125" text-anchor="middle" fill="#5A5449" font-size="11">t3</text>
      <rect x="522" y="96" width="60" height="46" fill="#F6E9E4" stroke="#BF3B24" stroke-width="2"/>
      <text x="552" y="125" text-anchor="middle" fill="#5A5449" font-size="11">t4</text>
      <rect x="596" y="96" width="60" height="46" fill="#F6E9E4" stroke="#BF3B24" stroke-width="2"/>
      <text x="626" y="125" text-anchor="middle" fill="#5A5449" font-size="11">t5</text>
      <rect x="670" y="96" width="60" height="46" fill="#F6E9E4" stroke="#BF3B24" stroke-width="2"/>
      <text x="700" y="125" text-anchor="middle" fill="#5A5449" font-size="11">t6</text>
    <path d="M180 200 L240 200 L240 119 L292 119" fill="none" stroke="#BF3B24" stroke-width="2" marker-end="url(#cA)"/>
    <g class="wave w1"><text x="330" y="162" text-anchor="middle" fill="#BF3B24" font-size="15">&#10007;</text></g>
    <g class="wave w2"><text x="404" y="162" text-anchor="middle" fill="#BF3B24" font-size="15">&#10007;</text></g>
    <g class="wave w3"><text x="478" y="162" text-anchor="middle" fill="#BF3B24" font-size="15">&#10007;</text></g>
    <g class="wave w4"><text x="552" y="162" text-anchor="middle" fill="#BF3B24" font-size="15">&#10007;</text></g>
    <g class="wave w5"><text x="626" y="162" text-anchor="middle" fill="#BF3B24" font-size="15">&#10007;</text></g>
    <g class="wave w6"><text x="700" y="162" text-anchor="middle" fill="#BF3B24" font-size="15">&#10007;</text></g>
    <g class="wave w6">
      <rect x="760" y="96" width="210" height="46" fill="#BF3B24"/>
      <text x="865" y="118" text-anchor="middle" fill="#FCEFE6" font-size="12">0 healthy targets</text>
      <text x="865" y="136" text-anchor="middle" fill="#FCEFE6" font-size="11">all six replaced at once</text>
    </g>
    <text x="760" y="164" fill="#BF3B24" font-size="11.5">a cache blip became a cold start</text>
    <text x="760" y="181" fill="#BF3B24" font-size="11.5">stampede with no capacity left</text>

    <line x1="30" y1="300" x2="970" y2="300" stroke="#E4DBCB" stroke-width="1"/>

    <text x="300" y="332" fill="#5A5449" font-size="12">readiness ignores redis &#8212; redis is a soft dependency</text>
      <rect x="300" y="346" width="60" height="46" fill="#F1F3EA" stroke="#5A7A3F" stroke-width="2"/>
      <text x="330" y="375" text-anchor="middle" fill="#5A5449" font-size="11">t1</text>
      <rect x="374" y="346" width="60" height="46" fill="#F1F3EA" stroke="#5A7A3F" stroke-width="2"/>
      <text x="404" y="375" text-anchor="middle" fill="#5A5449" font-size="11">t2</text>
      <rect x="448" y="346" width="60" height="46" fill="#F1F3EA" stroke="#5A7A3F" stroke-width="2"/>
      <text x="478" y="375" text-anchor="middle" fill="#5A5449" font-size="11">t3</text>
      <rect x="522" y="346" width="60" height="46" fill="#F1F3EA" stroke="#5A7A3F" stroke-width="2"/>
      <text x="552" y="375" text-anchor="middle" fill="#5A5449" font-size="11">t4</text>
      <rect x="596" y="346" width="60" height="46" fill="#F1F3EA" stroke="#5A7A3F" stroke-width="2"/>
      <text x="626" y="375" text-anchor="middle" fill="#5A5449" font-size="11">t5</text>
      <rect x="670" y="346" width="60" height="46" fill="#F1F3EA" stroke="#5A7A3F" stroke-width="2"/>
      <text x="700" y="375" text-anchor="middle" fill="#5A5449" font-size="11">t6</text>
    <path d="M180 252 L240 252 L240 369 L292 369" fill="none" stroke="#D6CBB6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cA)"/>
    <text x="246" y="392" fill="#8A8578" font-size="11">not consulted</text>
    <g class="wave w6">
      <rect x="760" y="346" width="210" height="46" fill="#5A7A3F"/>
      <text x="865" y="368" text-anchor="middle" fill="#F1F3EA" font-size="12">6 healthy targets</text>
      <text x="865" y="386" text-anchor="middle" fill="#F1F3EA" font-size="11">slower, and still serving</text>
    </g>
    <text x="760" y="414" fill="#5A7A3F" font-size="11.5">degraded is a state, not a failure</text>

    <text x="30" y="444" fill="#1B1712" font-size="13.5">A readiness check is a request to be taken out of service. Only list the</text>
    <text x="30" y="465" fill="#1B1712" font-size="13.5">dependencies you would rather go dark than serve without.</text>
  </g>
</svg>
