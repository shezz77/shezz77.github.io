<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Horizontal bars counting people, all on one linear scale. Microsoft employed 223,000 people in June 2026. About 60,000 of them were made eligible for the October 2026 voluntary exit offer. Microsoft says it expects under 5 percent of those to take it, which is fewer than 3,000 people, a bar so short it is barely visible. Below, the two earlier 2026 rounds for comparison: about 8,750 US employees were offered the April voluntary retirement programme and more than 30 percent, roughly 2,600, took it; and 4,800 people were laid off in July. The 60,000 offer is expected to move about as many people as the 8,750 one did, and fewer than the July layoffs.">
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 11s ease-out infinite; }
    @keyframes grow { 0%, 3% { transform: scaleX(0); } 12%, 93% { transform: scaleX(1); } 99%, 100% { transform: scaleX(1); opacity: 0; } }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; }
    .d3 { animation-delay: 2.2s; } .d4 { animation-delay: 2.5s; } .d5 { animation-delay: 2.8s; }
    .fade { opacity: 0; animation: fade 11s ease-out infinite; animation-delay: 1.4s; }
    .fade2 { animation-delay: 3.6s; }
    @keyframes fade { 0%, 8% { opacity: 0; } 14%, 92% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: none; }
      .fade { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="500" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">60,000 OFFERED, UNDER 3,000 EXPECTED</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Microsoft headcount, its October 2026 exit offer, and its own uptake estimate. People, one scale.</text>

    <text x="30" y="100" fill="#5A5449" font-size="11" letter-spacing="2">THE OCTOBER OFFER</text>
    <text x="30" y="131" fill="#1B1712" font-size="12.5">all of Microsoft, June 2026</text>
    <rect class="bar" x="380" y="118" width="560" height="18" fill="#1B1712"/>
    <text x="940" y="152" fill="#1B1712" font-size="12" text-anchor="end">223,000</text>
    <text x="30" y="179" fill="#1B1712" font-size="12.5">eligible for the exit offer</text>
    <rect class="bar d1" x="380" y="166" width="150.7" height="18" fill="#E0A458"/>
    <text x="540" y="179" fill="#5A5449" font-size="12">~60,000 · 27%</text>
    <text x="30" y="211" fill="#1B1712" font-size="12.5">expected to take it: "under 5%"</text>
    <rect class="bar d2" x="380" y="198" width="7.5" height="18" fill="#BF3B24"/>
    <text class="fade" x="397" y="211" fill="#BF3B24" font-size="12">&lt; 3,000 · about 1.3% of the company</text>

    <line x1="30" y1="240" x2="970" y2="240" stroke="#D6CBB6" stroke-width="1.2"/>

    <text x="30" y="270" fill="#5A5449" font-size="11" letter-spacing="2">EARLIER IN 2026</text>
    <text x="30" y="301" fill="#1B1712" font-size="12.5">April retirement offer: eligible</text>
    <rect class="bar d3" x="380" y="288" width="22" height="18" fill="#E0A458"/>
    <text x="412" y="301" fill="#5A5449" font-size="12">~8,750, US only</text>
    <text x="30" y="333" fill="#1B1712" font-size="12.5">April: took it (more than 30%)</text>
    <rect class="bar d4" x="380" y="320" width="6.6" height="18" fill="#BF3B24"/>
    <text x="396" y="333" fill="#5A5449" font-size="12">~2,600</text>
    <text x="30" y="365" fill="#1B1712" font-size="12.5">July layoffs</text>
    <rect class="bar d5" x="380" y="352" width="12.1" height="18" fill="#1B1712"/>
    <text x="402" y="365" fill="#5A5449" font-size="12">4,800</text>

    <line x1="380" y1="110" x2="380" y2="378" stroke="#5A5449" stroke-width="1.2"/>
    <line x1="30" y1="400" x2="970" y2="400" stroke="#D6CBB6" stroke-width="1.2"/>

    <text class="fade fade2" x="30" y="432" fill="#1B1712" font-size="12.5">An offer to 60,000 is expected to move about as many people as an offer to 8,750 did.</text>
    <text class="fade fade2" x="30" y="456" fill="#1B1712" font-size="12.5">And fewer than the 4,800 Microsoft laid off in July without asking.</text>
    <text x="30" y="486" fill="#8A8578" font-size="11">Sources: CNBC, Fortune and CBS News, 26–30 Oct 2026; Microsoft spokesperson's uptake estimate.</text>
  </g>
</svg>
