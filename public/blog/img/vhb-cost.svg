<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">Illustrative monthly AI capacity calculation</title><desc id="desc">Invented inputs. $8,000 gross capacity less $4,800 extra review and repair and $1,000 tools leaves $2,200. Common zero-to-$8,000 bar scale.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.mono { font-family: 'IBM Plex Mono', Menlo, monospace; letter-spacing: 2px; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
.second { animation-delay: .25s; }
.reveal { animation: reveal .8s ease-out both; }
.r1 { animation-delay: .3s; } .r2 { animation-delay: .8s; } .r3 { animation-delay: 1.3s; } .r4 { animation-delay: 1.8s; } .r5 { animation-delay: 2.3s; }
.packet { animation: travel 3.5s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes reveal { from { opacity: .15; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes travel { 0% { transform: translateX(-110px); opacity: 0; } 15% { opacity: 1; } 80%,100% { transform: translateX(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .grow,.reveal,.packet { animation: none; transform: none; opacity: 1; } }
</style>
<rect x="0" y="0" width="800" height="650" fill="#FCFAF4" /><rect x="0" y="0" width="800" height="7" fill="#BF3B24" />
<text x="40" y="58" font-size="21" fill="#BF3B24" font-weight="700" class="mono">THE ARITHMETIC OF “SAVINGS”</text><text x="40" y="111" font-size="34" fill="#1B1712" font-weight="700" >The headline is not the remainder.</text><rect x="40" y="138" width="720" height="42" fill="#F5F1E8" /><text x="56" y="166" font-size="21" fill="#BF3B24" font-weight="700" class="mono">ILLUSTRATIVE MONTH · INVENTED INPUTS</text><text x="40" y="220" font-size="25" fill="#1B1712" font-weight="700" >Drafting capacity saved</text><text x="760" y="220" font-size="29" fill="#365A49" font-weight="700" text-anchor="end">$8,000</text><rect x="40" y="232" width="720" height="18" fill="#F5F1E8" /><rect x="40" y="232" width="720.0" height="18" fill="#365A49" class="grow"/><text x="40" y="277" font-size="20" fill="#5A5449" font-weight="400" >100 hours × $80</text><text x="40" y="314" font-size="25" fill="#1B1712" font-weight="700" >Extra review + repair</text><text x="760" y="314" font-size="29" fill="#BF3B24" font-weight="700" text-anchor="end">−$4,800</text><rect x="40" y="326" width="720" height="18" fill="#F5F1E8" /><rect x="40" y="326" width="432.0" height="18" fill="#BF3B24" class="grow"/><text x="40" y="371" font-size="20" fill="#5A5449" font-weight="400" >60 hours × $80</text><text x="40" y="408" font-size="25" fill="#1B1712" font-weight="700" >Tools</text><text x="760" y="408" font-size="29" fill="#5A5449" font-weight="700" text-anchor="end">−$1,000</text><rect x="40" y="420" width="720" height="18" fill="#F5F1E8" /><rect x="40" y="420" width="90.0" height="18" fill="#5A5449" class="grow"/><text x="40" y="465" font-size="20" fill="#5A5449" font-weight="400" >Assumed monthly spend</text><text x="40" y="502" font-size="25" fill="#1B1712" font-weight="700" >Net capacity value</text><text x="760" y="502" font-size="29" fill="#365A49" font-weight="700" text-anchor="end">$2,200</text><rect x="40" y="514" width="720" height="18" fill="#F5F1E8" /><rect x="40" y="514" width="198.0" height="18" fill="#365A49" class="grow"/><text x="40" y="559" font-size="20" fill="#5A5449" font-weight="400" >Before incidents and other costs</text><line x1="40" y1="578" x2="760" y2="578" stroke="#D6CBB6" /><text x="40" y="610" font-size="29" fill="#1B1712" font-weight="700" >$8,000 − $4,800 − $1,000 = $2,200</text><text x="40" y="638" font-size="18" fill="#5A5449" font-weight="400" >Capacity valued at an hourly rate does not automatically become cash saved.</text>
</svg>