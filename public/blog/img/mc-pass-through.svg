<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Three groups of horizontal bars on one linear scale, showing what changed per engineer per month after a company adopted AI coding agents, from Chen and Stratton's Harvard study of 718 firms. Writing, what the dashboard shows, in amber: lines of code added up 30 percent, commits up 20 percent, pull requests opened up 23 percent. Review, where it waited, in red: days from pull request to merge up 49 percent, pull requests sent back for changes up 92 percent, nearly double, and review comments per pull request up 35 percent. Shipped, what the company got, in black: Jira issues resolved up 3 percent, not statistically significant, drawn inside a dashed box that marks the 12 percent above which the study rules out any effect; and company headcount up 1 percent, no effect, with a fall of more than 2.9 percent ruled out.">
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 11s ease-out infinite; }
    @keyframes grow { 0%, 3% { transform: scaleX(0); } 12%, 93% { transform: scaleX(1); } 99%, 100% { transform: scaleX(1); opacity: 0; } }
    .d1 { animation-delay: .25s; } .d2 { animation-delay: .5s; }
    .d3 { animation-delay: 1.8s; } .d4 { animation-delay: 2.1s; } .d5 { animation-delay: 2.4s; }
    .d6 { animation-delay: 3.6s; } .d7 { animation-delay: 3.9s; }
    .fade { animation: fade 11s ease-out infinite; animation-delay: 3.6s; opacity: 0; }
    @keyframes fade { 0%, 8% { opacity: 0; } 14%, 92% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: none; }
      .fade { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="560" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">30% MORE CODE. HERE IS WHERE IT WENT.</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Change after a company adopts AI coding agents. Chen &amp; Stratton (Harvard), 718 firms, 725,938 workers.</text>

    <text x="30" y="100" fill="#B07A2E" font-size="11" letter-spacing="2">WRITING · WHAT THE DASHBOARD SHOWS</text>
    <text x="30" y="131" fill="#1B1712" font-size="12.5">lines of code added</text>
    <rect class="bar" x="380" y="118" width="165" height="18" fill="#E0A458"/>
    <text x="553" y="131" fill="#5A5449" font-size="12">+30%</text>
    <text x="30" y="163" fill="#1B1712" font-size="12.5">commits</text>
    <rect class="bar d1" x="380" y="150" width="110" height="18" fill="#E0A458"/>
    <text x="498" y="163" fill="#5A5449" font-size="12">+20%</text>
    <text x="30" y="195" fill="#1B1712" font-size="12.5">pull requests opened</text>
    <rect class="bar d2" x="380" y="182" width="126.5" height="18" fill="#E0A458"/>
    <text x="514" y="195" fill="#5A5449" font-size="12">+23%</text>

    <line x1="30" y1="222" x2="970" y2="222" stroke="#D6CBB6" stroke-width="1.2"/>

    <text x="30" y="252" fill="#BF3B24" font-size="11" letter-spacing="2">REVIEW · WHERE IT WAITED</text>
    <text x="30" y="283" fill="#1B1712" font-size="12.5">days from PR to merge</text>
    <rect class="bar d3" x="380" y="270" width="269.5" height="18" fill="#BF3B24"/>
    <text x="657" y="283" fill="#5A5449" font-size="12">+49%  (7.0 → 10.5 days)</text>
    <text x="30" y="315" fill="#1B1712" font-size="12.5">PRs sent back for changes</text>
    <rect class="bar d4" x="380" y="302" width="506" height="18" fill="#BF3B24"/>
    <text x="878" y="315" fill="#FCFAF4" font-size="12" text-anchor="end">+92%</text>
    <text x="30" y="347" fill="#1B1712" font-size="12.5">review comments per PR</text>
    <rect class="bar d5" x="380" y="334" width="192.5" height="18" fill="#BF3B24"/>
    <text x="580" y="347" fill="#5A5449" font-size="12">+35%</text>

    <line x1="30" y1="374" x2="970" y2="374" stroke="#D6CBB6" stroke-width="1.2"/>

    <text x="30" y="404" fill="#1B1712" font-size="11" letter-spacing="2">SHIPPED · WHAT THE COMPANY GOT</text>
    <text x="30" y="435" fill="#1B1712" font-size="12.5">Jira issues resolved</text>
    <rect class="fade" x="380" y="422" width="66" height="18" fill="none" stroke="#5A5449" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect class="bar d6" x="380" y="422" width="16.5" height="18" fill="#1B1712"/>
    <text x="456" y="435" fill="#BF3B24" font-size="12">+3%, not significant</text>
    <text class="fade" x="620" y="435" fill="#8A8578" font-size="11.5">dashed: anything above 12% ruled out</text>
    <text x="30" y="467" fill="#1B1712" font-size="12.5">company headcount</text>
    <rect class="bar d7" x="380" y="454" width="5.5" height="18" fill="#1B1712"/>
    <text x="394" y="467" fill="#5A5449" font-size="12">+1%, no effect  (a fall above 2.9% ruled out)</text>

    <line x1="380" y1="110" x2="380" y2="482" stroke="#5A5449" stroke-width="1.2"/>

    <text x="30" y="526" fill="#8A8578" font-size="11">Writing went up by a third. Finished work did not move. The difference is waiting in review.</text>
  </g>
</svg>
