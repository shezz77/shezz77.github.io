    <text x="222" y="82" fill="#BF3B24" font-size="11">02:00 never happens</text>

    <g class="pulse">
      <rect x="178" y="230" width="56" height="36" fill="#F0D9AE" stroke="#E0A458" stroke-width="2"/>
    </g>
    <text x="242" y="222" fill="#7A6A3F" font-size="11">01:00 happens twice</text>

    <g fill="#1B1712" font-size="13">
      <text x="30" y="113">Sun 8 Mar</text>
      <text x="30" y="183">Mon 9 Mar</text>
      <text x="30" y="253">Sun 1 Nov</text>
    </g>
    <g font-size="13" text-anchor="start">
      <text x="872" y="107" fill="#BF3B24">23h</text><text x="872" y="124" fill="#8A8578" font-size="11">82,800s</text>
      <text x="872" y="177" fill="#1B1712">24h</text><text x="872" y="194" fill="#8A8578" font-size="11">86,400s</text>
      <text x="872" y="247" fill="#BF3B24">25h</text><text x="872" y="264" fill="#8A8578" font-size="11">90,000s</text>
    </g>

    <line x1="30" y1="296" x2="970" y2="296" stroke="#E4DBCB" stroke-width="1"/>
    <text x="30" y="324" fill="#1B1712" font-size="13.5">Advance a bucket edge by adding 86,400,000 milliseconds and you lose an hour in March and duplicate one in November.</text>
    <text x="30" y="344" fill="#1B1712" font-size="13.5">The denominator moves too: nine tracked hours is 39.1% of one of these days and 36.0% of another.</text>
