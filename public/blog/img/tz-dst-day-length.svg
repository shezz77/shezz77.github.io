<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Three local calendar days in America/Los_Angeles drawn at the same width. Sunday 8 March has 23 hour cells because 02:00 never happens; Monday 9 March has the usual 24; Sunday 1 November has 25 because 01:00 happens twice. The three buckets hold 82,800, 86,400 and 90,000 seconds respectively, so a day is not a fixed number of seconds.">
  <style>
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: .45; }
      50%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="360" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
