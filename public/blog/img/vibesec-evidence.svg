<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="Four bars and two panels of evidence. Forty-five percent of AI-generated code samples failed a security test. Eighty-six percent failed to defend against cross-site scripting. Eighty-eight percent failed to defend against log injection. Ten point three percent of 1,645 deployed apps built on one popular platform were found with a wide-open database. A panel notes that AI-assisted commits leak a secret at 3.2 percent against a 1.5 percent baseline on public GitHub. A second panel notes that a scan of 1,400 deployed vibe-coded apps found 2,038 critical vulnerabilities, more than 400 exposed secrets and 175 instances of exposed personal data.">
  <style>
    .bar { transform-origin: 450px 0; animation: grow 8s ease-out infinite; }
    @keyframes grow { 0%, 4% { transform: scaleX(0); } 24%, 88% { transform: scaleX(1); } 99%, 100% { transform: scaleX(0); } }
    .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; } .b4 { animation-delay: .9s; }
    .val { animation: val 8s ease-out infinite; }
    @keyframes val { 0%, 16% { opacity: 0; } 30%, 88% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .v2 { animation-delay: .3s; } .v3 { animation-delay: .6s; } .v4 { animation-delay: .9s; }
    .panel { animation: val 8s ease-out infinite; animation-delay: 1.4s; }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: scaleX(1); }
      .val, .panel { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="490" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">THE FAILURE RATE IS NOT AN ANECDOTE</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Veracode read 100-plus models across 80 coding tasks; a separate scan read 1,645 deployed apps on one popular platform.</text>

    <g font-size="12.5" text-anchor="end" fill="#1B1712">
      <text x="430" y="134">AI-generated code samples failing a security test</text>
      <text x="430" y="182">samples failing to defend against XSS</text>
      <text x="430" y="230">samples failing to defend against log injection</text>
      <text x="430" y="278">deployed apps found with a wide-open database</text>
    </g>

    <g fill="#EFE9DC">
      <rect x="450" y="117" width="500" height="18"/>
      <rect x="450" y="165" width="500" height="18"/>
      <rect x="450" y="213" width="500" height="18"/>
      <rect x="450" y="261" width="500" height="18"/>
    </g>

    <g fill="#BF3B24" opacity=".82">
      <rect class="bar"    x="450" y="117" width="225" height="18"/>
      <rect class="bar b2" x="450" y="165" width="430" height="18"/>
      <rect class="bar b3" x="450" y="213" width="440" height="18"/>
      <rect class="bar b4" x="450" y="261" width="52"  height="18"/>
    </g>

    <g font-size="12.5" fill="#BF3B24">
      <text class="val"    x="687" y="134">45%</text>
      <text class="val v2" x="892" y="182">86%</text>
      <text class="val v3" x="902" y="230">88%</text>
      <text class="val v4" x="514" y="278">10.3%  —  170 apps, 303 open endpoints</text>
    </g>

    <line x1="30" y1="312" x2="970" y2="312" stroke="#E2DACA" stroke-width="1" stroke-dasharray="4 5"/>

    <g class="panel">
      <rect x="30" y="338" width="450" height="106" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5" rx="3"/>
      <text x="50" y="366" fill="#BF3B24" font-size="10.5" letter-spacing="2.5">SECRETS, PUBLIC GITHUB</text>
      <text x="50" y="394" fill="#1B1712" font-size="12.5">3.2% of AI-assisted commits leak a secret,</text>
      <text x="50" y="416" fill="#1B1712" font-size="12.5">against a 1.5% baseline. Twice the rate,</text>
      <text x="50" y="434" fill="#8A8578" font-size="11.5">on roughly ten times the volume.</text>

      <rect x="520" y="338" width="450" height="106" fill="#F5F1E8" stroke="#BF3B24" stroke-width="1.5" rx="3"/>
      <text x="540" y="366" fill="#BF3B24" font-size="10.5" letter-spacing="2.5">1,400 DEPLOYED VIBE-CODED APPS</text>
      <text x="540" y="394" fill="#1B1712" font-size="12.5">2,038 critical vulnerabilities. 400+ secrets.</text>
      <text x="540" y="416" fill="#1B1712" font-size="12.5">175 instances of exposed personal data,</text>
      <text x="540" y="434" fill="#8A8578" font-size="11.5">including bank details. All of it live.</text>
    </g>

    <text x="30" y="474" fill="#8A8578" font-size="11">None of this is a story about a bad model. Every row is a check that "does the demo work" is structurally unable to see.</text>
  </g>
</svg>
