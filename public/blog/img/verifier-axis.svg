<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="A single axis running from subjects with a cheap external verifier to subjects with none. From left to right: does it compile, for Rust, Go and TypeScript; do the tests pass, for algorithms and SQL; does it stay up, for Terraform and Kubernetes; does it reproduce, for statistics and data work; does a peer agree, for system design and writing; and you find out later, for medicine, law and strategy. A shaded band covers the right-hand end, where a self-taught LLM course is a supplement rather than a substitute.">
  <style>
    .pt { animation: pt 9s ease-in-out infinite; }
    .p2 { animation-delay: .7s; } .p3 { animation-delay: 1.4s; } .p4 { animation-delay: 2.1s; }
    .p5 { animation-delay: 2.8s; } .p6 { animation-delay: 3.5s; }
    @keyframes pt {
      0%, 3%    { fill: #FCFAF4; stroke-width: 2.5; }
      8%, 26%   { fill: #BF3B24; stroke-width: 5; }
      32%, 100% { fill: #FCFAF4; stroke-width: 2.5; }
    }
    .band { animation: band 9s ease-in-out infinite; }
    @keyframes band { 0%, 40% { opacity: .05; } 70%, 100% { opacity: .13; } }
    @media (prefers-reduced-motion: reduce) {
      .pt { animation: none; fill: #FCFAF4; stroke-width: 2.5; }
      .band { animation: none; opacity: .1; }
    }
  </style>
  <rect width="1000" height="430" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">THE ONLY AXIS THAT DECIDES THIS</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Not how good the model is at the subject &#8212; how cheaply something other than the model can tell you that you are wrong</text>

    <rect class="band" x="796" y="96" width="174" height="238" fill="#BF3B24"/>
    <text x="883" y="120" fill="#BF3B24" font-size="11" text-anchor="middle">SUPPLEMENT,</text>
    <text x="883" y="136" fill="#BF3B24" font-size="11" text-anchor="middle">NOT SUBSTITUTE</text>

    <line x1="60" y1="220" x2="940" y2="220" stroke="#D6CBB6" stroke-width="2"/>
    <text x="60" y="360" fill="#443E35" font-size="11.5">a verifier that is cheap, external and indifferent</text>
    <text x="940" y="360" fill="#443E35" font-size="11.5" text-anchor="end">your own judgement, and nothing else</text>
    <polygon points="60,214 60,226 48,220" fill="#D6CBB6"/>
    <polygon points="940,214 940,226 952,220" fill="#D6CBB6"/>

    <g stroke="#BF3B24">
      <circle class="pt"    cx="115" cy="220" r="7"/>
      <circle class="pt p2" cx="270" cy="220" r="7"/>
      <circle class="pt p3" cx="425" cy="220" r="7"/>
      <circle class="pt p4" cx="580" cy="220" r="7"/>
      <circle class="pt p5" cx="735" cy="220" r="7"/>
      <circle class="pt p6" cx="883" cy="220" r="7"/>
    </g>
    <g stroke="#E2DACA" stroke-width="1.5">
      <line x1="115" y1="213" x2="115" y2="196"/><line x1="425" y1="213" x2="425" y2="196"/>
      <line x1="735" y1="213" x2="735" y2="196"/>
      <line x1="270" y1="227" x2="270" y2="244"/><line x1="580" y1="227" x2="580" y2="244"/>
      <line x1="883" y1="227" x2="883" y2="244"/>
    </g>

    <g text-anchor="middle">
      <text x="115" y="180" fill="#1B1712" font-size="13">does it compile?</text>
      <text x="115" y="160" fill="#8A8578" font-size="10.5">Rust, Go, TypeScript</text>
      <text x="425" y="180" fill="#1B1712" font-size="13">does it stay up?</text>
      <text x="425" y="160" fill="#8A8578" font-size="10.5">Terraform, Kubernetes</text>
      <text x="735" y="180" fill="#1B1712" font-size="13">does a peer agree?</text>
      <text x="735" y="160" fill="#8A8578" font-size="10.5">system design, writing</text>

      <text x="270" y="266" fill="#1B1712" font-size="13">do the tests pass?</text>
      <text x="270" y="286" fill="#8A8578" font-size="10.5">algorithms, SQL</text>
      <text x="580" y="266" fill="#1B1712" font-size="13">does it reproduce?</text>
      <text x="580" y="286" fill="#8A8578" font-size="10.5">statistics, data work</text>
      <text x="883" y="266" fill="#1B1712" font-size="13">you find out later</text>
      <text x="883" y="286" fill="#8A8578" font-size="10.5">medicine, law, strategy</text>
    </g>

    <text x="30" y="404" fill="#1B1712" font-size="13.5">The further right you sit, the more of the course you are grading yourself &#8212; and the grader is the thing being graded.</text>
  </g>
</svg>
