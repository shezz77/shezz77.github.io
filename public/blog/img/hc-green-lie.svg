<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Two request lanes separated by a dashed boundary marking where the application begins. The load balancer probe reaches nginx, which answers the health path with a static 200 and returns without ever crossing into the application. A real user request crosses the boundary into php-fpm, where all forty worker children are busy, and times out with a 502. The load balancer therefore reports every target healthy while users receive errors.">
  <defs>
    <marker id="hcA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8578"/>
    </marker>
    <path id="hcProbe" d="M196 130 L236 130"/>
    <path id="hcUser" d="M196 275 L236 275"/>
    <path id="hcCross" d="M586 275 L676 275"/>
  </defs>
  <style>
    .fx { animation: fx 8s ease-out infinite; opacity: 0; }
    .d1 { animation-delay: .5s; } .d2 { animation-delay: 1.1s; }
    @keyframes fx { 0%,1.5%{opacity:0} 7%,95%{opacity:1} 99%,100%{opacity:0} }
    .busy { animation: busy 2.4s ease-in-out infinite; }
    @keyframes busy { 0%,100%{opacity:.5} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      .fx { animation: none; opacity: 1; }
      .busy { animation: none; opacity: 1; }
      .pkt { display: none; }
    }
  </style>
  <rect width="1000" height="440" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">THE CHECK THAT NEVER REACHED THE APP</text>

    <line x1="640" y1="66" x2="640" y2="350" stroke="#BF3B24" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="652" y="80" fill="#BF3B24" font-size="11.5">the application starts here</text>

    <!-- probe lane -->
    <rect x="30" y="92" width="166" height="76" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="113" y="122" text-anchor="middle" fill="#1B1712" font-size="13">ALB probe</text>
    <text x="113" y="144" text-anchor="middle" fill="#5A5449" font-size="11">every 15s</text>
    <line x1="196" y1="130" x2="232" y2="130" stroke="#8A8578" stroke-width="2" marker-end="url(#hcA)"/>

    <rect x="240" y="92" width="346" height="76" fill="#F1EEE1" stroke="#E0A458" stroke-width="3"/>
    <text x="258" y="120" fill="#1B1712" font-size="13">nginx &#183; location = /healthz</text>
    <text x="258" y="144" fill="#7A6A3F" font-size="11.5">return 200 'ok';</text>

    <path d="M586 130 L616 130" fill="none" stroke="#5A7A3F" stroke-width="2" marker-end="url(#hcA)"/>
    <path d="M616 130 L616 200 L113 200 L113 172" fill="none" stroke="#5A7A3F" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#hcA)"/>
    <text x="330" y="182" fill="#5A7A3F" font-size="11.5">200, in under a millisecond &#8212; never crossed</text>

    <!-- user lane -->
    <rect x="30" y="237" width="166" height="76" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="113" y="267" text-anchor="middle" fill="#1B1712" font-size="13">user request</text>
    <text x="113" y="289" text-anchor="middle" fill="#5A5449" font-size="11">POST /intervals</text>
    <line x1="196" y1="275" x2="232" y2="275" stroke="#8A8578" stroke-width="2" marker-end="url(#hcA)"/>

    <rect x="240" y="237" width="346" height="76" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="258" y="265" fill="#1B1712" font-size="13">nginx &#183; location /</text>
    <text x="258" y="289" fill="#5A5449" font-size="11.5">fastcgi_pass php:9000;</text>
    <line x1="586" y1="275" x2="676" y2="275" stroke="#8A8578" stroke-width="2" marker-end="url(#hcA)"/>

    <rect x="684" y="237" width="286" height="76" fill="#F6E9E4" stroke="#BF3B24" stroke-width="3"/>
    <text x="700" y="264" fill="#1B1712" font-size="13">php-fpm</text>
    <g class="busy">
      <rect x="700" y="276" width="254" height="12" fill="#BF3B24"/>
    </g>
    <text x="700" y="304" fill="#BF3B24" font-size="11.5">40 / 40 children busy &#183; backlog full</text>

    <text x="684" y="336" fill="#BF3B24" font-size="11.5">502 after fastcgi_read_timeout</text>

    <g class="pkt">
      <circle r="6" fill="#5A7A3F"><animateMotion dur="1.1s" repeatCount="indefinite" calcMode="linear"><mpath href="#hcProbe"/></animateMotion></circle>
      <circle r="6" fill="#BF3B24"><animateMotion dur="1.6s" repeatCount="indefinite" calcMode="linear"><mpath href="#hcUser"/></animateMotion></circle>
      <circle r="6" fill="#BF3B24"><animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear"><mpath href="#hcCross"/></animateMotion></circle>
    </g>

    <line x1="30" y1="372" x2="970" y2="372" stroke="#E4DBCB" stroke-width="1"/>
    <g class="fx d1">
      <text x="30" y="402" fill="#5A7A3F" font-size="14">ALB: 4 / 4 targets healthy</text>
    </g>
    <g class="fx d2">
      <text x="380" y="402" fill="#BF3B24" font-size="14">users: 502 on every write</text>
    </g>
    <text x="30" y="428" fill="#1B1712" font-size="13">Both statements were true at the same time for nineteen minutes.</text>
  </g>
</svg>
