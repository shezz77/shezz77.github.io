<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="A table-chart of Microsoft's spending on property and equipment against its headcount, by fiscal year ending June. Fiscal 2023: 28.1 billion dollars, 221,000 employees, about 127,000 dollars per employee. Fiscal 2024: 44.5 billion, 228,000 employees, about 195,000 per employee. Fiscal 2025: 64.6 billion, 228,000 employees, about 283,000 per employee. Fiscal 2026: 115.9 billion, 223,000 employees, about 520,000 per employee. Calendar 2026 guidance: about 170 billion. Spending has quadrupled while headcount has stayed flat at around 225,000.">
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 11s ease-out infinite; }
    @keyframes grow { 0%, 3% { transform: scaleX(0); } 12%, 93% { transform: scaleX(1); } 99%, 100% { transform: scaleX(1); opacity: 0; } }
    .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; } .d4 { animation-delay: 1.6s; }
    .fade { opacity: 0; animation: fade 11s ease-out infinite; animation-delay: 2.6s; }
    @keyframes fade { 0%, 8% { opacity: 0; } 14%, 92% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: none; }
      .fade { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="470" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">MORE EQUIPMENT, SAME PEOPLE</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Microsoft: spending on property and equipment vs headcount. Fiscal years end in June.</text>

    <text x="30" y="104" fill="#5A5449" font-size="11" letter-spacing="2">YEAR</text>
    <text x="150" y="104" fill="#5A5449" font-size="11" letter-spacing="2">EQUIPMENT SPEND</text>
    <text x="850" y="104" fill="#5A5449" font-size="11" letter-spacing="2" text-anchor="end">PEOPLE</text>
    <text x="970" y="104" fill="#5A5449" font-size="11" letter-spacing="2" text-anchor="end">PER HEAD</text>
    <line x1="30" y1="116" x2="970" y2="116" stroke="#D6CBB6" stroke-width="1.2"/>

    <text x="30" y="149" fill="#1B1712" font-size="12.5">FY2023</text>
    <rect class="bar" x="150" y="136" width="82.6" height="18" fill="#1B1712"/>
    <text x="242" y="149" fill="#5A5449" font-size="12">$28.1bn</text>
    <text x="850" y="149" fill="#1B1712" font-size="12.5" text-anchor="end">221,000</text>
    <text x="970" y="149" fill="#1B1712" font-size="12.5" text-anchor="end">$127k</text>

    <text x="30" y="191" fill="#1B1712" font-size="12.5">FY2024</text>
    <rect class="bar d1" x="150" y="178" width="130.9" height="18" fill="#1B1712"/>
    <text x="291" y="191" fill="#5A5449" font-size="12">$44.5bn</text>
    <text x="850" y="191" fill="#1B1712" font-size="12.5" text-anchor="end">228,000</text>
    <text x="970" y="191" fill="#1B1712" font-size="12.5" text-anchor="end">$195k</text>

    <text x="30" y="233" fill="#1B1712" font-size="12.5">FY2025</text>
    <rect class="bar d2" x="150" y="220" width="190" height="18" fill="#1B1712"/>
    <text x="350" y="233" fill="#5A5449" font-size="12">$64.6bn</text>
    <text x="850" y="233" fill="#1B1712" font-size="12.5" text-anchor="end">228,000</text>
    <text x="970" y="233" fill="#1B1712" font-size="12.5" text-anchor="end">$283k</text>

    <text x="30" y="275" fill="#1B1712" font-size="12.5">FY2026</text>
    <rect class="bar d3" x="150" y="262" width="340.9" height="18" fill="#BF3B24"/>
    <text x="501" y="275" fill="#BF3B24" font-size="12">$115.9bn</text>
    <text x="850" y="275" fill="#1B1712" font-size="12.5" text-anchor="end">223,000</text>
    <text x="970" y="275" fill="#BF3B24" font-size="12.5" text-anchor="end">$520k</text>

    <text x="30" y="317" fill="#5A5449" font-size="12.5">CY2026</text>
    <rect class="bar d4" x="150" y="304" width="500" height="18" fill="#F5F1E8" stroke="#BF3B24" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="660" y="317" fill="#5A5449" font-size="12">~$170bn guided</text>
    <text x="850" y="317" fill="#8A8578" font-size="12.5" text-anchor="end">?</text>
    <text x="970" y="317" fill="#8A8578" font-size="12.5" text-anchor="end">?</text>

    <line x1="30" y1="346" x2="970" y2="346" stroke="#D6CBB6" stroke-width="1.2"/>

    <text class="fade" x="30" y="380" fill="#1B1712" font-size="12.5">Equipment spend: <tspan fill="#BF3B24">4.1x</tspan> in three years. Headcount: <tspan fill="#BF3B24">+1%</tspan>.</text>
    <text class="fade" x="30" y="404" fill="#1B1712" font-size="12.5">Three quarters of the latest quarter's spend went on short-lived assets, mostly CPUs and GPUs.</text>
    <text x="30" y="452" fill="#8A8578" font-size="11">Sources: Microsoft 10-K filings and FY27 Q1 results; CY2026 guidance from Amy Hood, 28 Oct 2026.</text>
  </g>
</svg>
