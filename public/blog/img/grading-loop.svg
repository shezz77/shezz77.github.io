<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Two grading loops side by side. In the closed loop the model writes the question, you answer, the model grades its own question and reports a high score; no participant in the loop knows the answer independently. In the open loop the model sets a task, you build it, a compiler or test suite or production system judges the result, and the model explains the failure; the judge cannot be argued with or flattered.">
  <style>
    .flow { stroke-dasharray: 10 10; animation: travel 3s linear infinite; }
    @keyframes travel { to { stroke-dashoffset: -20; } }
    .judge { animation: judge 4s ease-in-out infinite; }
    @keyframes judge {
      0%, 100% { stroke: #BF3B24; stroke-width: 2.5; }
      50%      { stroke: #BF3B24; stroke-width: 5; }
    }
    .self { animation: self 4s ease-in-out infinite; }
    @keyframes self { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; stroke-dasharray: none; }
      .judge { animation: none; stroke-width: 2.5; }
      .self { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="500" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">WHO IS ALLOWED TO SAY YOU ARE WRONG</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Prompts 7, 8 and 10 all end in a grade. Only one of these two loops produces a grade worth having</text>

    <rect x="30" y="88" width="456" height="350" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="54" y="120" fill="#1B1712" font-size="15">the closed loop</text>
    <text x="54" y="142" fill="#8A8578" font-size="11.5">prompt 8, run exactly as written</text>
    <g fill="#FCFAF4" stroke="#D6CBB6" stroke-width="1.5">
      <rect x="54" y="160" width="356" height="48"/><rect x="54" y="216" width="356" height="48"/>
      <rect x="54" y="272" width="356" height="48"/>
    </g>
    <rect class="self" x="54" y="328" width="356" height="48" fill="#FCFAF4" stroke="#E0803A" stroke-width="2.5"/>
    <g font-size="12.5" fill="#443E35">
      <text x="74" y="189">it writes the questions</text>
      <text x="74" y="245">you answer them</text>
      <text x="74" y="301">it marks its own questions</text>
      <text x="74" y="357" fill="#B4602C">&#8220;86 / 100 &#8212; strong grasp of the fundamentals&#8221;#8220;86 / 100 &#8220;86 / 100 &#8212; strong grasp of the fundamentals&#8221;#8212; strong grasp of the basics&#8220;86 / 100 &#8212; strong grasp of the fundamentals&#8221;#8221;</text>
    </g>
    <path class="flow" d="M 410 352 L 450 352 L 450 184 L 414 184" fill="none" stroke="#B9A98C" stroke-width="2"/>
    <polygon points="418,178 418,190 406,184" fill="#B9A98C"/>
    <text x="54" y="410" fill="#5A5449" font-size="12">Nothing in this loop knows the answer independently,</text>
    <text x="54" y="428" fill="#5A5449" font-size="12">and one participant is trying to be encouraging.</text>

    <rect x="514" y="88" width="456" height="350" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="538" y="120" fill="#1B1712" font-size="15">the open loop</text>
    <text x="538" y="142" fill="#8A8578" font-size="11.5">prompt 10, with a judge bolted on</text>
    <g fill="#FCFAF4" stroke="#D6CBB6" stroke-width="1.5">
      <rect x="538" y="160" width="356" height="48"/><rect x="538" y="216" width="356" height="48"/>
      <rect x="538" y="328" width="356" height="48"/>
    </g>
    <rect class="judge" x="538" y="272" width="356" height="48" fill="#FCFAF4" stroke="#BF3B24"/>
    <g font-size="12.5" fill="#443E35">
      <text x="558" y="189">it sets a task with a rubric</text>
      <text x="558" y="245">you build the thing</text>
      <text x="558" y="301" fill="#BF3B24">the compiler, the tests, real traffic decide</text>
      <text x="558" y="357">it explains the failure you were handed</text>
    </g>
    <path class="flow" d="M 894 352 L 934 352 L 934 184 L 898 184" fill="none" stroke="#B9A98C" stroke-width="2"/>
    <polygon points="902,178 902,190 890,184" fill="#B9A98C"/>
    <text x="538" y="410" fill="#5A5449" font-size="12">The judge did not write the question, cannot be</text>
    <text x="538" y="428" fill="#5A5449" font-size="12">argued with, and has no interest in your morale.</text>

    <text x="30" y="474" fill="#1B1712" font-size="13.5">The model is excellent at explaining a verdict and unreliable at issuing one. Let something else issue it.</text>
  </g>
</svg>
