<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="A pipeline. Raw activity intervals stored as UTC instants feed a rollup worker that splits every interval at each bucket edge. The worker writes to two tables: dailyActivity, keyed by member and day on the UTC calendar, used as the ledger; and dailyActivityTz, keyed by member, timezone and day on the tenant's reporting calendar, used for reports. A marker travels from the source through the worker and fans out to both tables at once.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8578"/>
    </marker>
    <path id="feed" d="M234 235 L286 235"/>
    <path id="up" d="M474 235 L505 235 L505 129 L532 129"/>
    <path id="dn" d="M474 235 L505 235 L505 341 L532 341"/>
  </defs>
  <style>
    .fx { animation: fx 8s ease-out infinite; opacity: 0; }
    .d1 { animation-delay: .5s; }
    .d2 { animation-delay: 1s; }
    @keyframes fx {
      0%, 1.5%  { opacity: 0; }
      7%, 95%   { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fx { animation: none; opacity: 1; }
      .pkt { display: none; }
    }
  </style>
  <rect width="1000" height="470" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">SAME SECONDS, TWO CALENDARS</text>

    <path d="M232 235 L505 235 L505 129 L534 129" fill="none" stroke="#8A8578" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M232 235 L505 235 L505 341 L534 341" fill="none" stroke="#8A8578" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="30" y="175" width="200" height="120" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="130" y="207" text-anchor="middle" fill="#1B1712" font-size="14">activityInterval</text>
    <text x="130" y="231" text-anchor="middle" fill="#5A5449" font-size="11.5">startedAt, endedAt</text>
    <text x="130" y="250" text-anchor="middle" fill="#5A5449" font-size="11.5">UTC instants</text>
    <text x="130" y="274" text-anchor="middle" fill="#BF3B24" font-size="11.5">never read directly</text>

    <rect x="290" y="175" width="180" height="120" fill="#F1EEE1" stroke="#E0A458" stroke-width="3"/>
    <text x="380" y="212" text-anchor="middle" fill="#1B1712" font-size="14">rollup worker</text>
    <text x="380" y="240" text-anchor="middle" fill="#7A6A3F" font-size="11.5">splits each interval</text>
    <text x="380" y="259" text-anchor="middle" fill="#7A6A3F" font-size="11.5">at every bucket edge</text>
    <text x="380" y="281" text-anchor="middle" fill="#8A8578" font-size="11">recompute, never +=</text>

    <g class="fx d1">
      <rect x="540" y="60" width="430" height="132" fill="#F5F1E8" stroke="#1B1712" stroke-width="2"/>
      <text x="560" y="92" fill="#1B1712" font-size="14">dailyActivity &#8212; the ledger</text>
      <text x="560" y="118" fill="#5A5449" font-size="11.5">PRIMARY KEY (memberId, day)</text>
      <text x="560" y="140" fill="#5A5449" font-size="11.5">day = the UTC calendar, for everyone</text>
      <text x="560" y="164" fill="#5A7A3F" font-size="11.5">billing, absolute windows, cross-tenant sums</text>
      <text x="560" y="182" fill="#8A8578" font-size="11">independent of anyone&#8217;s timezone by construction</text>
    </g>

    <g class="fx d2">
      <rect x="540" y="278" width="430" height="132" fill="#F5F1E8" stroke="#1B1712" stroke-width="2"/>
      <text x="560" y="310" fill="#1B1712" font-size="14">dailyActivityTz &#8212; the report</text>
      <text x="560" y="336" fill="#5A5449" font-size="11.5">PRIMARY KEY (memberId, tz, day)</text>
      <text x="560" y="358" fill="#5A5449" font-size="11.5">day = the tenant&#8217;s reporting calendar</text>
      <text x="560" y="382" fill="#5A7A3F" font-size="11.5">every screen, export and alert a human reads</text>
      <text x="560" y="400" fill="#8A8578" font-size="11">one row per tz actually in use &#8212; not per tz that exists</text>
    </g>

    <g class="pkt">
      <circle r="6" fill="#BF3B24">
        <animateMotion dur="1.2s" repeatCount="indefinite" calcMode="linear"><mpath href="#feed"/></animateMotion>
      </circle>
      <circle r="6" fill="#BF3B24">
        <animateMotion dur="2s" repeatCount="indefinite" calcMode="linear"><mpath href="#up"/></animateMotion>
      </circle>
      <circle r="6" fill="#BF3B24">
        <animateMotion dur="2s" repeatCount="indefinite" calcMode="linear"><mpath href="#dn"/></animateMotion>
      </circle>
    </g>

    <line x1="30" y1="428" x2="970" y2="428" stroke="#E4DBCB" stroke-width="1"/>
    <text x="30" y="450" fill="#1B1712" font-size="13.5">Dropping the UTC table looks like deleting a duplicate. It deletes the only</text>
    <text x="30" y="464" fill="#1B1712" font-size="13.5">total that does not depend on whose calendar you asked about.</text>
  </g>
</svg>
