<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
<title id="title">Five steps from generated output to owned software</title><desc id="desc">Specify, generate, prove, release and learn. Each change carries evidence and an accountable owner. Proposed workflow.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.mono { font-family: 'IBM Plex Mono', Menlo, monospace; letter-spacing: 2px; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
.second { animation-delay: .25s; }
.reveal { animation: reveal .8s ease-out both; }
.r1 { animation-delay: .3s; } .r2 { animation-delay: .8s; } .r3 { animation-delay: 1.3s; } .r4 { animation-delay: 1.8s; } .r5 { animation-delay: 2.3s; }
.packet { animation: travel 3.5s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes reveal { from { opacity: .15; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes travel { 0% { transform: translateX(-110px); opacity: 0; } 15% { opacity: 1; } 80%,100% { transform: translateX(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .grow,.reveal,.packet { animation: none; transform: none; opacity: 1; } }
</style>
<rect x="0" y="0" width="800" height="900" fill="#FCFAF4" /><rect x="0" y="0" width="800" height="7" fill="#BF3B24" />
<text x="40" y="58" font-size="21" fill="#BF3B24" font-weight="700" class="mono">FROM OUTPUT TO OWNERSHIP</text><text x="40" y="111" font-size="34" fill="#1B1712" font-weight="700" >Make the evidence travel with it.</text><text x="40" y="151" font-size="22" fill="#5A5449" font-weight="400" >A proposed operating model; depth follows consequence.</text><g class="reveal r1"><rect x="40" y="191" width="720" height="103" fill="#F5F1E8" stroke="#D6CBB6"/><rect x="40" y="191" width="88" height="103" fill="#1B1712" /><text x="84" y="255" font-size="34" fill="#FCFAF4" font-weight="700" text-anchor="middle">01</text><text x="152" y="233" font-size="31" fill="#1B1712" font-weight="700" >Specify</text><text x="152" y="269" font-size="23" fill="#5A5449" font-weight="400" >Outcome · business rules · failure cases</text></g><path d="M399 297v13m-6-6 6 6 6-6" fill="none" stroke="#5A5449" stroke-width="2"/><g class="reveal r2"><rect x="40" y="317" width="720" height="103" fill="#F5F1E8" stroke="#D6CBB6"/><rect x="40" y="317" width="88" height="103" fill="#1B1712" /><text x="84" y="381" font-size="34" fill="#FCFAF4" font-weight="700" text-anchor="middle">02</text><text x="152" y="359" font-size="31" fill="#1B1712" font-weight="700" >Generate</text><text x="152" y="395" font-size="23" fill="#5A5449" font-weight="400" >Bounded change · limited environment</text></g><path d="M399 423v13m-6-6 6 6 6-6" fill="none" stroke="#5A5449" stroke-width="2"/><g class="reveal r3"><rect x="40" y="443" width="720" height="103" fill="#F5F1E8" stroke="#D6CBB6"/><rect x="40" y="443" width="88" height="103" fill="#BF3B24" /><text x="84" y="507" font-size="34" fill="#FCFAF4" font-weight="700" text-anchor="middle">03</text><text x="152" y="485" font-size="31" fill="#BF3B24" font-weight="700" >Prove</text><text x="152" y="521" font-size="23" fill="#5A5449" font-weight="400" >Tests · security checks · informed review</text></g><path d="M399 549v13m-6-6 6 6 6-6" fill="none" stroke="#5A5449" stroke-width="2"/><g class="reveal r4"><rect x="40" y="569" width="720" height="103" fill="#F5F1E8" stroke="#D6CBB6"/><rect x="40" y="569" width="88" height="103" fill="#1B1712" /><text x="84" y="633" font-size="34" fill="#FCFAF4" font-weight="700" text-anchor="middle">04</text><text x="152" y="611" font-size="31" fill="#1B1712" font-weight="700" >Release</text><text x="152" y="647" font-size="23" fill="#5A5449" font-weight="400" >Named owner · monitoring · recovery</text></g><path d="M399 675v13m-6-6 6 6 6-6" fill="none" stroke="#5A5449" stroke-width="2"/><g class="reveal r5"><rect x="40" y="695" width="720" height="103" fill="#F5F1E8" stroke="#D6CBB6"/><rect x="40" y="695" width="88" height="103" fill="#365A49" /><text x="84" y="759" font-size="34" fill="#FCFAF4" font-weight="700" text-anchor="middle">05</text><text x="152" y="737" font-size="31" fill="#365A49" font-weight="700" >Learn</text><text x="152" y="773" font-size="23" fill="#5A5449" font-weight="400" >Rework · incidents · customer outcomes</text></g><line x1="40" y1="838" x2="760" y2="838" stroke="#D6CBB6" /><text x="40" y="874" font-size="25" fill="#365A49" font-weight="700" >Feed what you learn into the next specification.</text>
</svg>