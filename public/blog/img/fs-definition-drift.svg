<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Two panels. On the left, the 2010 definition of a full-stack programmer, held still: a generalist, someone who can create a non-trivial application by themselves, who can visualise what happens up and down the stack. On the right, what a job advert checks instead: a list of eight named technologies — React, Node, Firebase, Tailwind, Next.js, Docker, Kubernetes, GraphQL — which appears one row at a time and keeps growing, with a bar underneath labelled checklist length. The definition never moves; only the checklist does.">
  <style>
    .r { animation: pop 6.5s ease-out infinite; opacity: 0; }
    .r1 { animation-delay: 0.00s; } .r2 { animation-delay: 0.55s; } .r3 { animation-delay: 1.10s; } .r4 { animation-delay: 1.65s; } .r5 { animation-delay: 2.20s; } .r6 { animation-delay: 2.75s; } .r7 { animation-delay: 3.30s; } .r8 { animation-delay: 3.85s; }
    @keyframes pop {
      0%, 4%   { opacity: 0; transform: translateX(10px); }
      12%, 88% { opacity: 1; transform: translateX(0); }
      97%,100% { opacity: 0; transform: translateX(10px); }
    }
    .grow { animation: grow 6.5s ease-out infinite; }
    @keyframes grow {
      0%, 4%    { width: 0; }
      88%, 100% { width: 404px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .r    { animation: none; opacity: 1; transform: none; }
      .grow { animation: none; width: 404px; }
    }
  </style>
  <rect width="1000" height="470" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="40" fill="#BF3B24" font-size="13" letter-spacing="3">THE DEFINITION HELD STILL</text>

    <text x="48" y="88" fill="#8A8578" font-size="11" letter-spacing="1.5">2010 — WHAT IT MEANT</text>
    <rect x="48" y="106" width="404" height="196" fill="#F1EEE1" stroke="#E0A458" stroke-width="2"/>
    <text x="68" y="140" fill="#1B1712" font-size="14">A generalist, someone who</text>
    <text x="68" y="162" fill="#1B1712" font-size="14">can create a non-trivial</text>
    <text x="68" y="184" fill="#1B1712" font-size="14">application by themselves.</text>
    <line x1="68" y1="206" x2="432" y2="206" stroke="#D6CBB6" stroke-width="1"/>
    <text x="68" y="234" fill="#5A5449" font-size="12.5">…and can visualise what</text>
    <text x="68" y="253" fill="#5A5449" font-size="12.5">happens up and down the</text>
    <text x="68" y="272" fill="#5A5449" font-size="12.5">stack as it does its thing.</text>
    <text x="68" y="332" fill="#8A8578" font-size="11.5">Carlos Bueno, The Full Stack, Part I</text>
    <text x="68" y="352" fill="#7A6A3F" font-size="11.5">One sentence. No nouns you can tick.</text>

    <text x="548" y="88" fill="#8A8578" font-size="11" letter-spacing="1.5">WHAT THE ADVERT CHECKS</text>
    
    <g class="r r1">
      <rect x="548" y="118" width="404" height="26" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5"/>
      <text x="562" y="136" fill="#1B1712" font-size="12.5">React</text>
      <text x="938" y="136" text-anchor="end" fill="#8A8578" font-size="11">required</text>
    </g>
    <g class="r r2">
      <rect x="548" y="152" width="404" height="26" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5"/>
      <text x="562" y="170" fill="#1B1712" font-size="12.5">Node</text>
      <text x="938" y="170" text-anchor="end" fill="#8A8578" font-size="11">required</text>
    </g>
    <g class="r r3">
      <rect x="548" y="186" width="404" height="26" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5"/>
      <text x="562" y="204" fill="#1B1712" font-size="12.5">Firebase</text>
      <text x="938" y="204" text-anchor="end" fill="#8A8578" font-size="11">required</text>
    </g>
    <g class="r r4">
      <rect x="548" y="220" width="404" height="26" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5"/>
      <text x="562" y="238" fill="#1B1712" font-size="12.5">Tailwind</text>
      <text x="938" y="238" text-anchor="end" fill="#8A8578" font-size="11">required</text>
    </g>
    <g class="r r5">
      <rect x="548" y="254" width="404" height="26" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5"/>
      <text x="562" y="272" fill="#1B1712" font-size="12.5">Next.js</text>
      <text x="938" y="272" text-anchor="end" fill="#8A8578" font-size="11">required</text>
    </g>
    <g class="r r6">
      <rect x="548" y="288" width="404" height="26" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5"/>
      <text x="562" y="306" fill="#1B1712" font-size="12.5">Docker</text>
      <text x="938" y="306" text-anchor="end" fill="#8A8578" font-size="11">required</text>
    </g>
    <g class="r r7">
      <rect x="548" y="322" width="404" height="26" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5"/>
      <text x="562" y="340" fill="#1B1712" font-size="12.5">Kubernetes</text>
      <text x="938" y="340" text-anchor="end" fill="#8A8578" font-size="11">required</text>
    </g>
    <g class="r r8">
      <rect x="548" y="356" width="404" height="26" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5"/>
      <text x="562" y="374" fill="#1B1712" font-size="12.5">GraphQL</text>
      <text x="938" y="374" text-anchor="end" fill="#8A8578" font-size="11">required</text>
    </g>
    <rect x="548" y="404" width="404" height="8" fill="#F5F1E8"/>
    <rect class="grow" x="548" y="404" height="8" fill="#BF3B24"/>
    <text x="548" y="434" fill="#BF3B24" font-size="12">checklist length — the only part a filter can verify</text>

    <line x1="30" y1="452" x2="970" y2="452" stroke="#E4DBCB" stroke-width="1"/>
  </g>
</svg>
