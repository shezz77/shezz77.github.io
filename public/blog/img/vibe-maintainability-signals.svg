<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="Seven maintainability signals from 623 million code changes between 2023 and 2026, drawn as bars diverging from a centre line. Rising: code block duplication up 81 percent, error-masking constructs up 47 percent, copy and paste within a single commit up 41 percent, and two-week code churn up 15 percent. Falling: cross-file function calls down 35 percent, refactoring line moves down 70 percent, and updates to code last touched more than twelve months ago down 74 percent. Both directions are the wrong way.">
  <style>
    .bar { transform-origin: 640px 0; animation: grow 8s ease-out infinite; }
    @keyframes grow { 0%, 4% { transform: scaleX(0); } 26%, 88% { transform: scaleX(1); } 99%, 100% { transform: scaleX(0); } }
    .b2 { animation-delay: .35s; } .b3 { animation-delay: .7s; } .b4 { animation-delay: 1.05s; }
    .b5 { animation-delay: 1.4s; } .b6 { animation-delay: 1.75s; } .b7 { animation-delay: 2.1s; }
    .val { animation: val 8s ease-out infinite; }
    @keyframes val { 0%, 18% { opacity: 0; } 34%, 88% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .v2 { animation-delay: .35s; } .v3 { animation-delay: .7s; } .v4 { animation-delay: 1.05s; }
    .v5 { animation-delay: 1.4s; } .v6 { animation-delay: 1.75s; } .v7 { animation-delay: 2.1s; }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: scaleX(1); }
      .val { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="490" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">623 MILLION CODE CHANGES, 2023 TO 2026</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Roughly a quarter of commits now show AI assistance. Seven signals moved, and both directions are the wrong way.</text>

    <text x="660" y="104" fill="#BF3B24" font-size="10.5" letter-spacing="2.5">MORE OF IT</text>
    <text x="620" y="104" fill="#8A8578" font-size="10.5" letter-spacing="2.5" text-anchor="end">LESS OF IT</text>
    <line x1="640" y1="114" x2="640" y2="436" stroke="#D6CBB6" stroke-width="1.5"/>

    <g font-size="12.5" text-anchor="end" fill="#1B1712">
      <text x="300" y="150">code block duplication</text>
      <text x="300" y="192">error-masking constructs</text>
      <text x="300" y="234">copy/paste inside one commit</text>
      <text x="300" y="276">two-week code churn</text>
      <text x="300" y="338">cross-file function calls</text>
      <text x="300" y="380">refactoring line moves</text>
      <text x="300" y="422">updates to code over 12 months old</text>
    </g>

    <g fill="#BF3B24" opacity=".8">
      <rect class="bar"    x="640" y="133" width="280" height="18"/>
      <rect class="bar b2" x="640" y="175" width="162" height="18"/>
      <rect class="bar b3" x="640" y="217" width="142" height="18"/>
      <rect class="bar b4" x="640" y="259" width="52"  height="18"/>
    </g>
    <g fill="#E0A458" opacity=".85">
      <rect class="bar b5" x="519" y="321" width="121" height="18"/>
      <rect class="bar b6" x="398" y="363" width="242" height="18"/>
      <rect class="bar b7" x="384" y="405" width="256" height="18"/>
    </g>

    <g font-size="12.5">
      <text class="val"    x="932" y="150" fill="#BF3B24">+81%</text>
      <text class="val v2" x="814" y="192" fill="#BF3B24">+47%</text>
      <text class="val v3" x="794" y="234" fill="#BF3B24">+41%</text>
      <text class="val v4" x="704" y="276" fill="#BF3B24">+15%</text>
      <text class="val v5" x="507" y="338" fill="#5A5449" text-anchor="end">&#8722;35%</text>
      <text class="val v6" x="386" y="380" fill="#5A5449" text-anchor="end">&#8722;70%</text>
      <text class="val v7" x="372" y="422" fill="#5A5449" text-anchor="end">&#8722;74%</text>
    </g>

    <line x1="300" y1="298" x2="940" y2="298" stroke="#E2DACA" stroke-width="1" stroke-dasharray="4 5"/>
    <text x="30" y="468" fill="#8A8578" font-size="11">The bottom row is the one to read twice: it is the rate at which anybody goes back to code that has been there a year.</text>
  </g>
</svg>
