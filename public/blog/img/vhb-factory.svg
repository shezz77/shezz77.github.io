<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">The demo factory</title><desc id="desc">Generation feeds a verification gate; trust, ownership and recovery remain necessary.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.mono { font-family: 'IBM Plex Mono', Menlo, monospace; letter-spacing: 2px; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
.second { animation-delay: .25s; }
.reveal { animation: reveal .8s ease-out both; }
.r1 { animation-delay: .3s; } .r2 { animation-delay: .8s; } .r3 { animation-delay: 1.3s; } .r4 { animation-delay: 1.8s; } .r5 { animation-delay: 2.3s; }
.packet { animation: travel 3.5s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes reveal { from { opacity: .15; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes travel { 0% { transform: translateX(-110px); opacity: 0; } 15% { opacity: 1; } 80%,100% { transform: translateX(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .grow,.reveal,.packet { animation: none; transform: none; opacity: 1; } }
</style>
<rect x="0" y="0" width="1000" height="620" fill="#FCFAF4" /><rect x="0" y="0" width="1000" height="7" fill="#BF3B24" />
<text x="44" y="56" font-size="21" fill="#BF3B24" font-weight="700" class="mono">THE DEMO FACTORY</text><text x="44" y="116" font-size="44" fill="#1B1712" font-weight="700" >Fast in. Responsibility out.</text><text x="44" y="155" font-size="23" fill="#5A5449" font-weight="400" >A conceptual illustration of the work after generation.</text><rect x="44" y="214" width="214" height="210" fill="#F5F1E8" stroke="#D6CBB6"/><text x="68" y="252" font-size="19" fill="#5A5449" font-weight="700" class="mono">01 / PROMPT</text><rect x="68" y="282" width="128" height="9" fill="#D6CBB6" /><rect x="68" y="310" width="160" height="9" fill="#D6CBB6" /><rect x="68" y="338" width="108" height="9" fill="#D6CBB6" /><text x="68" y="395" font-size="30" fill="#1B1712" font-weight="700" >Build this.</text><line x1="258" y1="321" x2="324" y2="321" stroke="#BF3B24" stroke-width="3"/><path d="M314 313l10 8-10 8" fill="none" stroke="#BF3B24" stroke-width="3"/><rect x="334" y="214" width="302" height="210" fill="#1B1712" /><text x="356" y="252" font-size="19" fill="#E0A458" font-weight="700" class="mono">02 / CODE</text><g class="packet"><rect x="354" y="283" width="34" height="57" fill="#E0A458" /><line x1="361" y1="298" x2="380" y2="298" stroke="#1B1712" /><line x1="361" y1="309" x2="375" y2="309" stroke="#1B1712" /></g><g class="packet"><rect x="402" y="301" width="34" height="57" fill="#E0A458" /><line x1="409" y1="316" x2="428" y2="316" stroke="#1B1712" /><line x1="409" y1="327" x2="423" y2="327" stroke="#1B1712" /></g><g class="packet"><rect x="450" y="283" width="34" height="57" fill="#E0A458" /><line x1="457" y1="298" x2="476" y2="298" stroke="#1B1712" /><line x1="457" y1="309" x2="471" y2="309" stroke="#1B1712" /></g><g class="packet"><rect x="498" y="301" width="34" height="57" fill="#E0A458" /><line x1="505" y1="316" x2="524" y2="316" stroke="#1B1712" /><line x1="505" y1="327" x2="519" y2="327" stroke="#1B1712" /></g><g class="packet"><rect x="546" y="283" width="34" height="57" fill="#E0A458" /><line x1="553" y1="298" x2="572" y2="298" stroke="#1B1712" /><line x1="553" y1="309" x2="567" y2="309" stroke="#1B1712" /></g><text x="356" y="395" font-size="30" fill="#FCFAF4" font-weight="700" >Generate.</text><line x1="636" y1="321" x2="703" y2="321" stroke="#BF3B24" stroke-width="3"/><path d="M693 313l10 8-10 8" fill="none" stroke="#BF3B24" stroke-width="3"/><rect x="714" y="214" width="242" height="210" fill="#F5F1E8" stroke="#BF3B24" stroke-width="2"/><text x="736" y="252" font-size="19" fill="#BF3B24" font-weight="700" class="mono">03 / VERIFY</text><path d="M815 279l30 12v24c0 22-30 40-30 40s-30-18-30-40v-24z" fill="none" stroke="#BF3B24" stroke-width="3"/><path d="M800 316l11 11 20-24" fill="none" stroke="#BF3B24" stroke-width="4"/><text x="736" y="395" font-size="27" fill="#1B1712" font-weight="700" >Can we own it?</text><line x1="44" y1="465" x2="956" y2="465" stroke="#D6CBB6" /><text x="44" y="508" font-size="23" fill="#5A5449" font-weight="400" >Still required:</text><text x="44" y="553" font-size="28" fill="#365A49" font-weight="700" >Customer trust</text><text x="360" y="553" font-size="28" fill="#1B1712" font-weight="700" >A named owner</text><text x="690" y="553" font-size="28" fill="#BF3B24" font-weight="700" >A recovery plan</text><text x="44" y="595" font-size="19" fill="#5A5449" font-weight="400" >The queue is a proposed mechanism, not a measured dataset.</text>
</svg>