<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title"><title id="title">How much of the job did you explain?</title><style>.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.5s ease-out both}.second{animation-delay:.3s}.step{animation:step 1s ease-out both}.s2{animation-delay:.7s}.s3{animation-delay:1.4s}.s4{animation-delay:2.1s}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes step{from{opacity:.25}to{opacity:1}}@media(prefers-reduced-motion:reduce){.grow,.step{animation:none}}</style><rect x="0" y="0" width="800" height="480" fill="#FCFAF4" /><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="17" fill="#BF3B24" letter-spacing="2">THE BRIEF, BEFORE AND AFTER</text><text x="32" y="78" font-size="26" fill="#1B1712" >Five elements to make the task judgeable</text><path d="M 220 125 V 310" stroke="#E4DBCB"/><text x="220" y="340" font-size="18" fill="#5A5449" text-anchor="middle">0</text><path d="M 320 125 V 310" stroke="#E4DBCB"/><text x="320" y="340" font-size="18" fill="#5A5449" text-anchor="middle">1</text><path d="M 420 125 V 310" stroke="#E4DBCB"/><text x="420" y="340" font-size="18" fill="#5A5449" text-anchor="middle">2</text><path d="M 520 125 V 310" stroke="#E4DBCB"/><text x="520" y="340" font-size="18" fill="#5A5449" text-anchor="middle">3</text><path d="M 620 125 V 310" stroke="#E4DBCB"/><text x="620" y="340" font-size="18" fill="#5A5449" text-anchor="middle">4</text><path d="M 720 125 V 310" stroke="#E4DBCB"/><text x="720" y="340" font-size="18" fill="#5A5449" text-anchor="middle">5</text><text x="32" y="174" font-size="21" fill="#1B1712" >Vague request</text><rect x="220" y="145" width="100" height="45" fill="#A89A80" class="grow"/><text x="335" y="175" font-size="20" fill="#1B1712" >1 / 5</text><text x="32" y="264" font-size="21" fill="#1B1712" >Clear brief</text><rect x="220" y="235" width="500" height="45" fill="#BF3B24