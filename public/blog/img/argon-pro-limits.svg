<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Two panels about Google AI Pro limits. The first shows the Gemini app context window by plan as bars: Free 32 thousand tokens, Plus 128 thousand, Pro 1 million and Ultra 1 million, so Pro holds about thirty times more than Free. The second shows the usage window as a gauge that drains as work is done: a simple chat costs very little, a long chat or big file costs a medium amount, Deep Research costs a lot and video costs the most. When the gauge runs low you drop to Flash-Lite, then it refills after five hours, up to a weekly limit. The drain steps are illustrative, because Google publishes the words, not the numbers.">
  <style>
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(.2,.7,.2,1) both; }
    .g2 { animation-delay: .15s; } .g3 { animation-delay: .3s; } .g4 { animation-delay: .45s; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .tank { transform-box: fill-box; transform-origin: left center; animation: tank 12s ease-in-out infinite; }
    @keyframes tank {
      0%, 8%   { transform: scaleX(1); }
      12%, 22% { transform: scaleX(.97); }
      28%, 38% { transform: scaleX(.80); }
      44%, 54% { transform: scaleX(.46); }
      60%, 76% { transform: scaleX(.06); }
      86%, 100% { transform: scaleX(1); }
    }
    .c1, .c2, .c3, .c4 { opacity: .35; }
    .c1 { animation: c1 12s ease-in-out infinite; }
    .c2 { animation: c2 12s ease-in-out infinite; }
    .c3 { animation: c3 12s ease-in-out infinite; }
    .c4 { animation: c4 12s ease-in-out infinite; }
    @keyframes c1 { 0%, 8% { opacity: .35; } 11%, 24% { opacity: 1; } 28%, 100% { opacity: .35; } }
    @keyframes c2 { 0%, 24% { opacity: .35; } 27%, 40% { opacity: 1; } 44%, 100% { opacity: .35; } }
    @keyframes c3 { 0%, 40% { opacity: .35; } 43%, 56% { opacity: 1; } 60%, 100% { opacity: .35; } }
    @keyframes c4 { 0%, 56% { opacity: .35; } 59%, 72% { opacity: 1; } 76%, 100% { opacity: .35; } }
    .fb { opacity: 0; animation: fb 12s ease-in-out infinite; }
    @keyframes fb { 0%, 60% { opacity: 0; } 64%, 78% { opacity: 1; } 82%, 100% { opacity: 0; } }
    .rf { opacity: .45; animation: rf 12s ease-in-out infinite; }
    @keyframes rf { 0%, 78% { opacity: .45; } 82%, 94% { opacity: 1; } 100% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) {
      .grow, .tank { animation: none; }
      .c1, .c2, .c3, .c4, .rf { animation: none; opacity: 1; }
      .fb { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="520" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">WHAT $19.99 BUYS YOU IN THE GEMINI APP</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">The model is half of it. The other half is how much it can read at once, and how fast you use it up.</text>

    <text x="30" y="100" fill="#5A5449" font-size="10.5" letter-spacing="2.5">CONTEXT WINDOW, BY PLAN</text>
    <g font-size="12" fill="#1B1712" letter-spacing="1.5">
      <text x="30" y="131">FREE</text>
      <text x="30" y="163">PLUS</text>
      <text x="30" y="195" fill="#BF3B24">PRO</text>
      <text x="30" y="227">ULTRA</text>
    </g>
    <line x1="200" y1="112" x2="200" y2="236" stroke="#D6CBB6" stroke-width="1.5"/>
    <rect class="grow" x="200" y="120" width="22" height="14" rx="3" fill="#8A8578"/>
    <rect class="grow g2" x="200" y="152" width="90" height="14" rx="3" fill="#8A8578"/>
    <rect class="grow g3" x="200" y="184" width="700" height="14" rx="3" fill="#BF3B24"/>
    <rect class="grow g4" x="200" y="216" width="700" height="14" rx="3" fill="#5A5449"/>
    <g font-size="12" fill="#1B1712">
      <text x="232" y="131">32K tokens</text>
      <text x="300" y="163">128K tokens</text>
      <text x="910" y="195">1M</text>
      <text x="910" y="227">1M</text>
    </g>
    <text x="560" y="131" fill="#5A5449" font-size="11.5">Pro reads about 30x more than Free.</text>

    <line x1="30" y1="262" x2="970" y2="262" stroke="#E2DACA" stroke-width="1"/>

    <text x="30" y="296" fill="#5A5449" font-size="10.5" letter-spacing="2.5">ONE USAGE WINDOW (PRO = 4x THE FREE LIMIT)</text>
    <rect x="200" y="314" width="700" height="34" rx="5" fill="#F5F1E8" stroke="#D6CBB6"/>
    <rect class="tank" x="202" y="316" width="696" height="30" rx="4" fill="#BF3B24" fill-opacity=".85"/>
    <text x="30" y="336" fill="#1B1712" font-size="12">this window</text>

    <g font-size="12" fill="#1B1712">
      <g class="c1">
        <rect x="200" y="368" width="160" height="50" rx="5" fill="#F5F1E8" stroke="#D6CBB6"/>
        <text x="214" y="389">simple chat</text>
        <text x="214" y="407" fill="#5A5449" font-size="11">very low</text>
      </g>
      <g class="c2">
        <rect x="380" y="368" width="160" height="50" rx="5" fill="#F5F1E8" stroke="#D6CBB6"/>
        <text x="394" y="389">long chat, big file</text>
        <text x="394" y="407" fill="#5A5449" font-size="11">medium</text>
      </g>
      <g class="c3">
        <rect x="560" y="368" width="160" height="50" rx="5" fill="#F5F1E8" stroke="#D6CBB6"/>
        <text x="574" y="389">Deep Research</text>
        <text x="574" y="407" fill="#5A5449" font-size="11">high</text>
      </g>
      <g class="c4">
        <rect x="740" y="368" width="160" height="50" rx="5" fill="#F5F1E8" stroke="#D6CBB6"/>
        <text x="754" y="389">video generation</text>
        <text x="754" y="407" fill="#5A5449" font-size="11">the most</text>
      </g>
    </g>
    <text x="30" y="389" fill="#5A5449" font-size="11">what it</text>
    <text x="30" y="405" fill="#5A5449" font-size="11">costs</text>

    <text class="fb" x="200" y="448" fill="#BF3B24" font-size="12">Ran dry: you drop to Flash-Lite until it refills.</text>
    <text class="rf" x="900" y="448" fill="#1B1712" font-size="12" text-anchor="end">refills every 5 hours</text>
    <text x="30" y="482" fill="#5A5449" font-size="11.5">Refills stop at a weekly limit. Check both under Settings, Usage limits. Drain steps are illustrative:</text>
    <text x="30" y="500" fill="#5A5449" font-size="11.5">Google publishes the words very low, medium and high, not the numbers.</text>
  </g>
</svg>
