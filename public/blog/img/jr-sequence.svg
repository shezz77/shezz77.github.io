<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="A timeline from 2021 to 2026. In January 2022 Section 174 forces companies to amortise software salaries over five years, repricing engineers. Through 2022 interest rate rises and the correction to pandemic over-hiring follow. ChatGPT is released in November 2022, after all of these. In July 2025 Section 174 is permanently repealed and immediate expensing returns, withdrawing the main tax explanation. By June 2026 the employment gap for 22 to 25 year olds in AI-exposed occupations has nonetheless widened from 15 percent to 19 percent. A band marking the tax explanation fades out while the gap bar keeps growing.">
  <style>
    .taxband { animation: taxband 11s ease-in-out infinite; }
    @keyframes taxband { 0%, 46% { opacity: .16; } 62%, 100% { opacity: 0; } }
    .taxlbl { animation: taxlbl 11s ease-in-out infinite; }
    @keyframes taxlbl { 0%, 46% { opacity: 1; } 62%, 100% { opacity: .2; } }
    .gap { transform-origin: 0 431px; animation: gap 11s ease-in-out infinite; }
    @keyframes gap { 0%, 8% { transform: scaleY(0); } 40% { transform: scaleY(.62); } 72%, 100% { transform: scaleY(1); } }
    .mk { animation: mk 11s ease-in-out infinite; }
    @keyframes mk { 0%, 4% { transform: translateX(0); } 24% { transform: translateX(148px); } 44% { transform: translateX(296px); } 68% { transform: translateX(592px); } 88%, 100% { transform: translateX(800px); } }
    @media (prefers-reduced-motion: reduce) {
      .taxband { animation: none; opacity: .08; }
      .taxlbl { animation: none; opacity: .5; }
      .gap { animation: none; transform: scaleY(1); }
      .mk { animation: none; transform: translateX(800px); }
    }
  </style>
  <rect width="1000" height="470" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">THE HOLE WAS DUG BEFORE THE CHATBOT ARRIVED</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">And then the reason for digging it was withdrawn, and nobody filled it back in.</text>

    <rect class="taxband" x="100" y="96" width="596" height="250" fill="#E0A458"/>
    <text class="taxlbl" x="398" y="118" fill="#9A7A3E" font-size="10.5" letter-spacing="2.5" text-anchor="middle">THE TAX AND RATES EXPLANATION</text>

    <line x1="100" y1="360" x2="948" y2="360" stroke="#D6CBB6" stroke-width="1.5"/>
    <g fill="#D6CBB6">
      <circle cx="100" cy="360" r="4"/><circle cx="248" cy="360" r="4"/><circle cx="396" cy="360" r="4"/>
      <circle cx="692" cy="360" r="4"/><circle cx="900" cy="360" r="4"/>
    </g>

    <g font-size="12" fill="#1B1712">
      <text x="100" y="164">Jan 2022</text>
      <text x="100" y="186" fill="#5A5449" font-size="11.5">Section 174 forces</text>
      <text x="100" y="204" fill="#5A5449" font-size="11.5">five-year amortisation</text>
      <text x="100" y="222" fill="#5A5449" font-size="11.5">of dev salaries</text>

      <text x="248" y="252">2022</text>
      <text x="248" y="274" fill="#5A5449" font-size="11.5">rate rises, and the</text>
      <text x="248" y="292" fill="#5A5449" font-size="11.5">over-hiring correction</text>

      <text x="396" y="164">Nov 2022</text>
      <text x="396" y="186" fill="#BF3B24" font-size="11.5">ChatGPT — after</text>
      <text x="396" y="204" fill="#BF3B24" font-size="11.5">all of the above</text>

      <text x="692" y="252">Jul 2025</text>
      <text x="692" y="274" fill="#5A5449" font-size="11.5">Section 174 repealed,</text>
      <text x="692" y="292" fill="#5A5449" font-size="11.5">permanently</text>
    </g>

    <g class="mk"><circle cx="100" cy="360" r="7" fill="#BF3B24"/></g>

    <rect class="gap" x="900" y="391" width="48" height="40" fill="#BF3B24" opacity=".85"/>
    <text x="924" y="164" fill="#BF3B24" font-size="12" text-anchor="middle">Jun 2026</text>
    <text x="924" y="186" fill="#BF3B24" font-size="11.5" text-anchor="middle">gap 19%</text>
    <text x="924" y="204" fill="#8A8578" font-size="11" text-anchor="middle">was 15%</text>

    <text x="30" y="452" fill="#8A8578" font-size="11">The tax reason ended in 2025. The gap widened through 2026 anyway, which is the part that needs explaining.</text>
  </g>
</svg>
