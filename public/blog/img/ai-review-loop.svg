<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title"><title id="title">Brief, draft, check, revise, then check again</title><style>.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.5s ease-out both}.second{animation-delay:.3s}.step{animation:step 1s ease-out both}.s2{animation-delay:.7s}.s3{animation-delay:1.4s}.s4{animation-delay:2.1s}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes step{from{opacity:.25}to{opacity:1}}@media(prefers-reduced-motion:reduce){.grow,.step{animation:none}}</style><rect x="0" y="0" width="800" height="480" fill="#FCFAF4" /><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="17" fill="#BF3B24" letter-spacing="2">THE WORK IS A LOOP</text><text x="32" y="78" font-size="26" fill="#1B1712" >A draft is one step. Checking closes the loop.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BF3B24"/></marker></defs><g fill="none" stroke="#BF3B24" stroke-width="2" marker-end="url(#arrow)"><path d="M340 185 H410"/><path d="M580 235 V275"/><path d="M430 345 H360"/><path d="M190 400 V430 H580 V402"/></g><g class="step s1"><rect x="40" y="130" width="300" height="105" fill="#F5F1E8" /> <text x="60" y="163" font-size="17" fill="#BF3B24" >01</text><text x="105" y="164" font-size="24" fill="#1B1712" >BRIEF</text><text x="60" y="207" font-size="21" fill="#5A5449" >Define success</text></g><g class="step s2"><rect x="430" y="130" width="300" height="105" fill="#F5F1E8" /> <text x="450" y="163" font-size="17" fill="#BF3B24" >02</text><text x="495" y="164" font-size="24" fill="#1B1712" >DRAFT</text><text x="450" y="207" font-size="21" fill="#5A5449" >Make a first pass</text></g><g class="step s3"><rect x="430" y="290" width="300" height="105" fill="#F5F1E8" /> <text x="450" y="323" font-size="17" fill="#BF3B24" >03</text><text x="495" y="324" font-size="24" fill="#1B1712" >CHECK</text><text x="450" y="367" font-size="21" fill="#5A5449" >Verify against sources</text></g><g class="step s4"><rect x="40" y="290" width="300" height="105" fill="#F5F1E8" /> <text x="60" y="323" font-size="17" fill="#BF3B24" >04</text><text x="105" y="324" font-size="24" fill="#1B1712" >REVISE</text><text x="60" y="367" font-size="21" fill="#5A5449" >Fix a specific issue</text></g><text x="32" y="465" font-size="19" fill="#5A5449" >Check again after revision. Use the result when it passes.</text></g></svg>