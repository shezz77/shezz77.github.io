<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="A step chart of healthy task count over fourteen minutes. A narrow shaded band marks the ninety seconds during which Redis was unavailable. All six tasks fail their readiness check within that band and the count steps straight to zero, then climbs back one task at a time, reaching six again only at minute thirteen. The ninety-second dependency blip produced roughly eleven minutes at reduced capacity.">
  <style>
    .draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 8s ease-out infinite; }
    @keyframes draw { 0%,5%{stroke-dashoffset:100} 40%,92%{stroke-dashoffset:0} 99%,100%{stroke-dashoffset:100} }
    .fade { animation: fade 8s ease-out infinite; opacity: 0; }
    .f2 { animation-delay: 1.4s; }
    @keyframes fade { 0%,22%{opacity:0} 40%,92%{opacity:1} 99%,100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .fade { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="430" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="34" fill="#BF3B24" font-size="13" letter-spacing="3">A 90-SECOND BLIP, AN 11-MINUTE OUTAGE</text>
    <text x="30" y="56" fill="#8A8578" font-size="11.5">healthy tasks in the service, when readiness treats a cache as required</text>

    <rect x="210.0" y="90" width="90.0" height="230" fill="#E0A458" opacity=".28"/>
    <text x="255.0" y="82" text-anchor="middle" fill="#7A6A3F" font-size="11.5">redis down, 90s</text>
    <line x1="90" y1="320.0" x2="930" y2="320.0" stroke="#E4DBCB" stroke-width="1"/>
    <text x="78" y="324.0" text-anchor="end" fill="#A79E8C" font-size="11">0</text>
    <line x1="90" y1="243.3" x2="930" y2="243.3" stroke="#E4DBCB" stroke-width="1"/>
    <text x="78" y="247.3" text-anchor="end" fill="#A79E8C" font-size="11">2</text>
    <line x1="90" y1="166.7" x2="930" y2="166.7" stroke="#E4DBCB" stroke-width="1"/>
    <text x="78" y="170.7" text-anchor="end" fill="#A79E8C" font-size="11">4</text>
    <line x1="90" y1="90.0" x2="930" y2="90.0" stroke="#E4DBCB" stroke-width="1"/>
    <text x="78" y="94.0" text-anchor="end" fill="#A79E8C" font-size="11">6</text>
    <line x1="90" y1="90" x2="90" y2="320" stroke="#D6CBB6" stroke-width="1.5"/>
    <text x="90.0" y="342" text-anchor="middle" fill="#A79E8C" font-size="11">0</text>
    <text x="210.0" y="342" text-anchor="middle" fill="#A79E8C" font-size="11">2</text>
    <text x="330.0" y="342" text-anchor="middle" fill="#A79E8C" font-size="11">4</text>
    <text x="450.0" y="342" text-anchor="middle" fill="#A79E8C" font-size="11">6</text>
    <text x="570.0" y="342" text-anchor="middle" fill="#A79E8C" font-size="11">8</text>
    <text x="690.0" y="342" text-anchor="middle" fill="#A79E8C" font-size="11">10</text>
    <text x="810.0" y="342" text-anchor="middle" fill="#A79E8C" font-size="11">12</text>
    <text x="930.0" y="342" text-anchor="middle" fill="#A79E8C" font-size="11">14</text>
    <text x="510" y="364" text-anchor="middle" fill="#8A8578" font-size="11">minutes</text>

    <polyline class="draw" pathLength="100" points="90.0,90.0 222.0,90.0 222.0,90.0 234.0,90.0 234.0,320.0 480.0,320.0 480.0,320.0 540.0,320.0 540.0,281.7 588.0,281.7 588.0,243.3 642.0,243.3 642.0,205.0 702.0,205.0 702.0,166.7 774.0,166.7 774.0,128.3 846.0,128.3 846.0,90.0 930.0,90.0 930.0,90.0" fill="none" stroke="#BF3B24" stroke-width="2.5"/>

    <g class="fade f2">
      <line x1="234.0" y1="106" x2="846.0" y2="106" stroke="#BF3B24" stroke-width="1.5"/>
      <text x="540.0" y="100" text-anchor="middle" fill="#BF3B24" font-size="11.5">11 minutes below full capacity</text>
      <text x="342.0" y="306" fill="#BF3B24" font-size="12">0 healthy targets</text>
      <text x="666.0" y="191" fill="#443E35" font-size="12">replacements booting cold</text>
    </g>

    <line x1="30" y1="384" x2="970" y2="384" stroke="#E4DBCB" stroke-width="1"/>
    <text x="30" y="412" fill="#1B1712" font-size="13.5">The cache came back at minute three and a half. The service did not, because the check had already replaced every task.</text>
  </g>
</svg>