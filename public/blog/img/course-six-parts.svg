<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="A course broken into six parts. The four an LLM delivers well are syllabus, instruction, practice and feedback. The two it does not deliver are accountability, because nothing notices when you stop, and the credential, which is a claim a third party will accept without re-testing you.">
  <style>
    .a { stroke: #D6CBB6; stroke-width: 2; animation: lit 8s ease-in-out infinite; }
    .a2 { animation-delay: .55s; } .a3 { animation-delay: 1.1s; } .a4 { animation-delay: 1.65s; }
    .b { stroke: #C8BFAC; stroke-width: 2; stroke-dasharray: 7 6; animation: fade 8s ease-in-out infinite; }
    .b2 { animation-delay: .4s; }
    @keyframes lit {
      0%, 3%    { stroke: #D6CBB6; stroke-width: 2; }
      9%, 34%   { stroke: #BF3B24; stroke-width: 3.5; }
      40%, 100% { stroke: #D6CBB6; stroke-width: 2; }
    }
    @keyframes fade {
      0%, 45%   { opacity: .45; }
      58%, 82%  { opacity: 1; }
      95%, 100% { opacity: .45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; stroke: #D6CBB6; stroke-width: 2; }
      .b { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="470" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">WHAT A COURSE ACTUALLY SELLS YOU</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Six things arrive in one purchase, which is why nobody prices them separately &#8212; or notices which ones they wanted</text>

    <text x="30" y="100" fill="#443E35" font-size="11.5" letter-spacing="2">THE FOUR THEY GENUINELY DELIVER</text>

    <rect class="a"    x="30"  y="112" width="214" height="152" fill="#F5F1E8"/>
    <text x="48" y="146" fill="#1B1712" font-size="15">syllabus</text>
    <text x="48" y="176" fill="#5A5449" font-size="11.5">what to learn, and in</text>
    <text x="48" y="194" fill="#5A5449" font-size="11.5">what order</text>
    <text x="48" y="232" fill="#7A6A3F" font-size="11">prompts 1 &#183; 4 &#183; 6</text>
    <text x="48" y="250" fill="#8A8578" font-size="11">reshaped in ten seconds</text>

    <rect class="a a2" x="272" y="112" width="214" height="152" fill="#F5F1E8"/>
    <text x="290" y="146" fill="#1B1712" font-size="15">instruction</text>
    <text x="290" y="176" fill="#5A5449" font-size="11.5">explain it again, at</text>
    <text x="290" y="194" fill="#5A5449" font-size="11.5">my level, differently</text>
    <text x="290" y="232" fill="#7A6A3F" font-size="11">prompts 3 &#183; 5</text>
    <text x="290" y="250" fill="#8A8578" font-size="11">no video to rewind</text>

    <rect class="a a3" x="514" y="112" width="214" height="152" fill="#F5F1E8"/>
    <text x="532" y="146" fill="#1B1712" font-size="15">practice</text>
    <text x="532" y="176" fill="#5A5449" font-size="11.5">problems on demand,</text>
    <text x="532" y="194" fill="#5A5449" font-size="11.5">effectively endless</text>
    <text x="532" y="232" fill="#7A6A3F" font-size="11">prompts 7 &#183; 9</text>
    <text x="532" y="250" fill="#8A8578" font-size="11">the scarcest thing on a MOOC</text>

    <rect class="a a4" x="756" y="112" width="214" height="152" fill="#F5F1E8"/>
    <text x="774" y="146" fill="#1B1712" font-size="15">feedback</text>
    <text x="774" y="176" fill="#5A5449" font-size="11.5">on my answer, in</text>
    <text x="774" y="194" fill="#5A5449" font-size="11.5">seconds, unlimited</text>
    <text x="774" y="232" fill="#7A6A3F" font-size="11">prompts 7 &#183; 8 &#183; 10</text>
    <text x="774" y="250" fill="#E0803A" font-size="11">fast, and too generous</text>

    <text x="30" y="304" fill="#443E35" font-size="11.5" letter-spacing="2">TWO IT CANNOT</text>

    <rect class="b"    x="30"  y="316" width="456" height="106" fill="#FCFAF4"/>
    <text x="48" y="348" fill="#1B1712" font-size="15">accountability</text>
    <text x="48" y="378" fill="#5A5449" font-size="11.5">Nothing notices when you stop. A cohort has a Tuesday;</text>
    <text x="48" y="398" fill="#5A5449" font-size="11.5">a chat window will wait for you, patiently, for years.</text>

    <rect class="b b2" x="514" y="316" width="456" height="106" fill="#FCFAF4"/>
    <text x="532" y="348" fill="#1B1712" font-size="15">the credential</text>
    <text x="532" y="378" fill="#5A5449" font-size="11.5">A claim about you that a third party accepts without</text>
    <text x="532" y="398" fill="#5A5449" font-size="11.5">re-testing you. Its value is that you did not issue it.</text>

    <text x="30" y="452" fill="#1B1712" font-size="13.5">Four of six, and they are the four you spend your evenings on. The argument is about the other two.</text>
  </g>
</svg>
