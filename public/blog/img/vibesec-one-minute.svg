<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="A four-step timeline showing how a deployed vibe-coded app gives up its database in under a minute, with no exploit and no credentials. At seven seconds, open the site and read the JavaScript bundle. At twenty-one seconds, the project URL and the publishable key are in it, which is by design and is not the bug. At thirty-eight seconds, call the hosted data API with curl, selecting everything from the profiles table. At fifty-six seconds, the API returns 200 OK and every row in the table, shown as a panel of JSON with thousands more rows. A marker travels down the timeline and the final step is outlined in red.">
  <style>
    .st { animation: st 10s ease-out infinite; }
    @keyframes st { 0%, 4% { opacity: 0; } 10%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.4s; } .s5 { animation-delay: 3.2s; }
    .travel { animation: travel 10s ease-in-out infinite; }
    @keyframes travel {
      0%, 8% { transform: translateY(0); opacity: 1; }
      18%, 26% { transform: translateY(70px); }
      36%, 44% { transform: translateY(140px); }
      54%, 92% { transform: translateY(214px); opacity: 1; }
      98%, 100% { transform: translateY(214px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .st { animation: none; opacity: 1; }
      .travel { animation: none; transform: translateY(214px); }
    }
  </style>
  <rect width="1000" height="470" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">UNDER A MINUTE, NO EXPLOIT, NO CREDENTIALS</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Everything below is a documented feature being used exactly as documented. That is what makes it hard to notice.</text>

    <line x1="96" y1="104" x2="96" y2="392" stroke="#D6CBB6" stroke-width="1.5"/>

    <g class="st">
      <text x="78" y="126" fill="#BF3B24" font-size="12.5" text-anchor="end">0:07</text>
      <circle cx="96" cy="122" r="4.5" fill="#D6CBB6"/>
      <text x="120" y="126" fill="#1B1712" font-size="13">open the deployed site and read the JavaScript bundle</text>
      <text x="120" y="148" fill="#8A8578" font-size="11.5">no login, no scanner, no tooling beyond the browser</text>
    </g>

    <g class="st s2">
      <text x="78" y="196" fill="#BF3B24" font-size="12.5" text-anchor="end">0:21</text>
      <circle cx="96" cy="192" r="4.5" fill="#D6CBB6"/>
      <text x="120" y="196" fill="#1B1712" font-size="13">the project URL and the publishable key are in it</text>
      <text x="120" y="218" fill="#8A8578" font-size="11.5">they are meant to be public — this part is not the bug</text>
    </g>

    <g class="st s3">
      <text x="78" y="266" fill="#BF3B24" font-size="12.5" text-anchor="end">0:38</text>
      <circle cx="96" cy="262" r="4.5" fill="#D6CBB6"/>
      <text x="120" y="266" fill="#1B1712" font-size="13">ask the data API for a table nobody linked to</text>
      <text x="120" y="288" fill="#E0A458" font-size="12">curl "$URL/rest/v1/profiles?select=*" -H "apikey: $KEY"</text>
    </g>

    <g class="st s4">
      <rect x="110" y="316" width="440" height="60" fill="#F5F1E8" stroke="#BF3B24" stroke-width="1.8" rx="3"/>
      <text x="78" y="344" fill="#BF3B24" font-size="12.5" text-anchor="end">0:56</text>
      <circle cx="96" cy="340" r="4.5" fill="#BF3B24"/>
      <text x="124" y="344" fill="#BF3B24" font-size="13">200 OK, and every row in the table</text>
      <text x="124" y="364" fill="#5A5449" font-size="11.5">emails, phone numbers, whatever else it holds</text>
    </g>

    <g class="st s5">
      <text x="600" y="236" fill="#8A8578" font-size="10.5" letter-spacing="2.5">WHAT COMES BACK</text>
      <rect x="600" y="250" width="370" height="126" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5" rx="3"/>
      <text x="620" y="278" fill="#5A5449" font-size="11.5">[ { "id": 1, "email": "real@person.co",</text>
      <text x="620" y="298" fill="#5A5449" font-size="11.5">      "phone": "+44...", "plan": "pro" },</text>
      <text x="620" y="318" fill="#5A5449" font-size="11.5">  { "id": 2, "email": "also@real.co",</text>
      <text x="620" y="338" fill="#5A5449" font-size="11.5">      "phone": "+1...", "plan": "trial" },</text>
      <text x="620" y="360" fill="#BF3B24" font-size="11.5">  ... 4,812 more ]</text>
    </g>

    <circle class="travel" cx="96" cy="122" r="7" fill="#BF3B24" opacity=".85"/>

    <text x="30" y="440" fill="#8A8578" font-size="11">The key was never the secret. The policy behind it was the security control, and no policy was ever written.</text>
  </g>
</svg>
