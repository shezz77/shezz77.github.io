<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Eight layers of a stack drawn as stacked bars, from the browser component at the top down through the CDN, the route handler, the service layer, the ORM, the query plan, the connection pool and finally disk, network and kernel. A marker descends the left edge during an incident. It halts at the ORM layer, labelled floor A — the point where the answer becomes the ORM is slow and the problem is handed to somebody else. It then continues down to the query plan and the connection pool, labelled floor B, where the answer is that the index was never used. The caption says nobody descends all the way; the only question a title should be asking is which floor you stop on.">
  <style>
    .probe { animation: fall 11s cubic-bezier(.6,0,.35,1) infinite; }
    @keyframes fall {
      0%, 5%    { transform: translateY(0); }
      22%, 42%  { transform: translateY(196px); }
      58%, 80%  { transform: translateY(294px); }
      95%, 100% { transform: translateY(0); }
    }
    .fa { animation: fa 11s ease-in-out infinite; }
    .fb { animation: fb 11s ease-in-out infinite; }
    @keyframes fa { 0%,18% { opacity:.2 } 24%,44% { opacity:1 } 52%,100% { opacity:.2 } }
    @keyframes fb { 0%,54% { opacity:.2 } 60%,82% { opacity:1 } 90%,100% { opacity:.2 } }
    @media (prefers-reduced-motion: reduce) {
      .probe { animation: none; transform: translateY(196px); }
      .fa, .fb { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="540" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="40" fill="#BF3B24" font-size="13" letter-spacing="3">THE PAGE FIRES. HOW FAR DOWN CAN YOU GO?</text>
    <text x="70" y="76" fill="#8A8578" font-size="11" letter-spacing="1.5">CHECKOUT IS SLOW ON TUESDAYS</text>
    
    <rect x="70" y="96" width="590" height="40" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="88" y="121" fill="#1B1712" font-size="12.5">Browser — component, state, render</text>
    <text x="644" y="121" text-anchor="end" fill="#8A8578" font-size="10.5" letter-spacing="1">EVERYONE</text>
    <rect x="70" y="145" width="590" height="40" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="88" y="170" fill="#1B1712" font-size="12.5">CDN — cache headers, invalidation</text>
    
    <rect x="70" y="194" width="590" height="40" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="88" y="219" fill="#1B1712" font-size="12.5">Route handler / server action</text>
    
    <rect x="70" y="243" width="590" height="40" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="88" y="268" fill="#1B1712" font-size="12.5">Service layer — the business rule</text>
    
    <rect x="70" y="292" width="590" height="40" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="2"/>
    <text x="88" y="317" fill="#1B1712" font-size="12.5">ORM — the query it actually emitted</text>
    <text x="644" y="317" text-anchor="end" fill="#8A8578" font-size="10.5" letter-spacing="1">FLOOR A</text>
    <rect x="70" y="341" width="590" height="40" fill="#FCFAF4" stroke="#E4DBCB" stroke-width="2"/>
    <text x="88" y="366" fill="#8A8578" font-size="12.5">Query plan — was the index used</text>
    <text x="644" y="366" text-anchor="end" fill="#8A8578" font-size="10.5" letter-spacing="1">FLOOR B</text>
    <rect x="70" y="390" width="590" height="40" fill="#FCFAF4" stroke="#E4DBCB" stroke-width="2"/>
    <text x="88" y="415" fill="#8A8578" font-size="12.5">Connection pool — waits, saturation</text>
    
    <rect x="70" y="439" width="590" height="40" fill="#FCFAF4" stroke="#E4DBCB" stroke-width="2"/>
    <text x="88" y="464" fill="#8A8578" font-size="12.5">Disk, network, kernel</text>
    <text x="644" y="464" text-anchor="end" fill="#8A8578" font-size="10.5" letter-spacing="1">THE FLOOR</text>

    <g class="probe">
      <circle cx="46" cy="116" r="7" fill="#BF3B24"/>
      <line x1="46" y1="123" x2="46" y2="146" stroke="#BF3B24" stroke-width="2.5"/>
    </g>

    <g class="fa">
      <line x1="676" y1="316" x2="700" y2="316" stroke="#E0A458" stroke-width="2"/>
      <text x="712" y="308" fill="#7A6A3F" font-size="12.5">Stops here: “the ORM is slow.”</text>
      <text x="712" y="328" fill="#8A8578" font-size="11.5">True, unfalsifiable, and someone</text>
      <text x="712" y="346" fill="#8A8578" font-size="11.5">else's problem by lunchtime.</text>
    </g>

    <g class="fb">
      <line x1="676" y1="414" x2="700" y2="414" stroke="#BF3B24" stroke-width="2"/>
      <text x="712" y="406" fill="#BF3B24" font-size="12.5">Goes on: the index was never used.</text>
      <text x="712" y="426" fill="#8A8578" font-size="11.5">One composite index, no new</text>
      <text x="712" y="444" fill="#8A8578" font-size="11.5">framework, ticket closed.</text>
    </g>

    <line x1="30" y1="490" x2="970" y2="490" stroke="#E4DBCB" stroke-width="1"/>
    <text x="30" y="518" fill="#5A5449" font-size="12.5">Nobody descends to the kernel. Breadth is not the variable — the floor you stop on is, and no checklist can report it.</text>
  </g>
</svg>
