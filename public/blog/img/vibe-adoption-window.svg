<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-label="A curve showing the cost of adopting generated code against the time since it was generated. The cost is low and flat while the session is still open, a shaded band labelled the window, because you still have the prompt, the attempts you rejected and the reason you rejected them. The curve then climbs steeply over the following day and week and flattens out by the next month at a level labelled the price of adopting anyone else's legacy code. A marker travels up the curve. What expires is not the code, it is the context.">
  <style>
    .dot { animation: run 10s ease-in-out infinite; }
    @keyframes run {
      0%, 6%  { transform: translate(0,0); opacity: 1; }
      16% { transform: translate(90px,-10px); }
      26% { transform: translate(180px,-55px); }
      36% { transform: translate(270px,-115px); }
      46% { transform: translate(360px,-159px); }
      56% { transform: translate(450px,-185px); }
      66% { transform: translate(540px,-200px); }
      76% { transform: translate(630px,-209px); }
      86% { transform: translate(720px,-214px); }
      94% { transform: translate(830px,-217px); opacity: 1; }
      99%, 100% { transform: translate(830px,-217px); opacity: 0; }
    }
    .win { animation: win 10s ease-in-out infinite; }
    @keyframes win { 0%, 12% { opacity: .20; } 30%, 100% { opacity: .07; } }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 0; }
      .win { animation: none; opacity: .14; }
    }
  </style>
  <rect width="1000" height="450" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">WHAT EXPIRES IS NOT THE CODE, IT IS THE CONTEXT</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Adoption is cheap while you can still remember what you asked for. That is a much shorter window than the code's life.</text>

    <rect class="win" x="90" y="110" width="180" height="282" fill="#BF3B24"/>
    <text x="180" y="132" fill="#BF3B24" font-size="10.5" letter-spacing="2.5" text-anchor="middle">THE WINDOW</text>

    <line x1="90" y1="110" x2="90" y2="392" stroke="#D6CBB6" stroke-width="1.5"/>
    <line x1="90" y1="392" x2="940" y2="392" stroke="#D6CBB6" stroke-width="1.5"/>
    <text x="100" y="104" fill="#8A8578" font-size="10.5" letter-spacing="2.5">COST TO ADOPT</text>

    <text x="115" y="206" fill="#1B1712" font-size="12.5">you still have the prompt, the</text>
    <text x="115" y="226" fill="#1B1712" font-size="12.5">three attempts you threw away,</text>
    <text x="115" y="246" fill="#1B1712" font-size="12.5">and why you threw them</text>

    <path d="M110,355 C 170,352 200,348 250,326 C 300,304 340,262 400,226 C 460,190 520,176 580,166 C 650,155 720,147 800,142 L940,138"
          fill="none" stroke="#BF3B24" stroke-width="2.5"/>
    <line x1="560" y1="138" x2="940" y2="138" stroke="#E2DACA" stroke-width="1" stroke-dasharray="4 5"/>
    <text x="940" y="126" fill="#5A5449" font-size="12" text-anchor="end">the price of adopting anyone else's legacy code</text>

    <circle class="dot" cx="110" cy="355" r="6.5" fill="#BF3B24"/>

    <g font-size="11.5" fill="#8A8578" text-anchor="middle">
      <text x="180" y="414">same session</text>
      <text x="380" y="414">next day</text>
      <text x="580" y="414">next week</text>
      <text x="800" y="414">next month</text>
    </g>
    <text x="940" y="440" fill="#8A8578" font-size="11" text-anchor="end">time since it was generated</text>
  </g>
</svg>
