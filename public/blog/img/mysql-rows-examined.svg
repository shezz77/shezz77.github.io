<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Rows examined falling from 182,934 to 25 across four optimisation steps, with query time falling from 4.2 seconds to 40 milliseconds.">
  <rect width="1000" height="420" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="40" fill="#BF3B24" font-size="13" letter-spacing="3">ROWS EXAMINED TO RETURN 25 ROWS</text>

    <!-- baseline -->
    <text x="30" y="92" fill="#1B1712" font-size="14">baseline</text>
    <rect x="30" y="102" width="880" height="34" fill="#BF3B24"/>
    <text x="922" y="125" fill="#BF3B24" font-size="14">182,934</text>
    <text x="46" y="125" fill="#FCEFE6" font-size="13">4.20s · filesort over the whole result set</text>

    <!-- composite -->
    <text x="30" y="176" fill="#1B1712" font-size="14">+ composite index (equality, sort, range)</text>
    <rect x="30" y="186" width="193" height="34" fill="#C88A4A"/>
    <text x="235" y="209" fill="#8A6A32" font-size="14">40,025</text>
    <text x="46" y="209" fill="#FCFAF4" font-size="13">0.90s</text>

    <!-- covering -->
    <text x="30" y="260" fill="#1B1712" font-size="14">+ covering columns</text>
    <rect x="30" y="270" width="193" height="34" fill="#E0A458"/>
    <text x="235" y="293" fill="#8A6A32" font-size="14">40,025 · no table lookup</text>
    <text x="46" y="293" fill="#3F3A31" font-size="13">0.35s</text>

    <!-- keyset -->
    <text x="30" y="344" fill="#1B1712" font-size="14">+ keyset pagination</text>
    <rect x="30" y="354" width="6" height="34" fill="#1B1712"/>
    <text x="48" y="377" fill="#1B1712" font-size="14">25 — and page 1,600 costs the same as page 1</text>

    <text x="30" y="410" fill="#8A8578" font-size="12">bar length is proportional to rows examined · 0.04s at the final step</text>
  </g>
</svg>
