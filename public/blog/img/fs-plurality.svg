<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="One hundred dots standing for one hundred professional developers answering the 2025 Stack Overflow survey. Twenty-seven are marked full-stack and pulse together in a wave; fourteen are back-end; four are front-end; the remaining fifty-five are every other role combined. A caption notes that full-stack was the most common single answer, at thirty-one per cent in 2024 and twenty-seven per cent in 2025, and that a label held by more than a quarter of the profession no longer separates anyone from anyone.">
  <style>
    .fs { animation: wave 5.5s ease-in-out infinite; }
    .d0 { animation-delay: 0.00s; } .d1 { animation-delay: 0.28s; } .d2 { animation-delay: 0.56s; } .d3 { animation-delay: 0.84s; } .d4 { animation-delay: 1.12s; } .d5 { animation-delay: 1.40s; } .d6 { animation-delay: 1.68s; } .d7 { animation-delay: 1.96s; } .d8 { animation-delay: 2.24s; }
    @keyframes wave {
      0%, 40%, 100% { r: 6.5px; opacity: 1; }
      18%           { r: 10px;  opacity: .55; }
    }
    @media (prefers-reduced-motion: reduce) { .fs { animation: none; } }
  </style>
