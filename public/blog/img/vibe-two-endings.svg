<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Code an agent wrote this afternoon branches into three endings. Two are marked honest. The first is deleted: the prototype answered its question, and the answer was the note you wrote, not the code. The second is adopted: someone read it, owns it, and can change it next quarter without re-deriving it. The third, marked the default, is retained but not adopted: the code is in production, in git blame, and in nobody's head. A marker travels the third path repeatedly and its box pulses.">
  <style>
    .m1 { animation: m1 9s ease-in-out infinite; }
    .m2 { animation: m2 9s ease-in-out infinite; animation-delay: .5s; }
    .m3 { animation: m3 9s ease-in-out infinite; animation-delay: 1s; }
    @keyframes m1 { 0%, 8% { transform: translate(0,0); opacity: 0; } 14% { opacity: 1; } 40%, 100% { transform: translate(300px,-142px); opacity: 0; } }
    @keyframes m2 { 0%, 8% { transform: translate(0,0); opacity: 0; } 14% { opacity: 1; } 40%, 100% { transform: translate(300px,0); opacity: 0; } }
    @keyframes m3 { 0%, 8% { transform: translate(0,0); opacity: 0; } 14% { opacity: 1; } 44%, 100% { transform: translate(300px,152px); opacity: 0; } }
    .pulse { animation: pulse 9s ease-in-out infinite; }
    @keyframes pulse { 0%, 46% { stroke-width: 1.5; } 60%, 74% { stroke-width: 4; } 88%, 100% { stroke-width: 1.5; } }
    .drift { animation: drift 9s ease-in-out infinite; }
    @keyframes drift { 0%, 52% { opacity: 0; } 68%, 86% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .m1, .m2, .m3 { animation: none; opacity: 0; }
      .pulse { animation: none; stroke-width: 3; }
      .drift { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="520" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">EVERY GENERATED FILE ENDS ONE OF THREE WAYS</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Two of them are decisions. The third is what happens when nobody makes one.</text>

    <rect x="30" y="228" width="222" height="86" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5" rx="3"/>
    <text x="141" y="264" fill="#1B1712" font-size="13.5" text-anchor="middle">code an agent wrote</text>
    <text x="141" y="286" fill="#8A8578" font-size="12" text-anchor="middle">this afternoon</text>

    <g fill="none" stroke="#D6CBB6" stroke-width="1.5">
      <path d="M252 271 C 340 271, 340 129, 428 129"/>
      <path d="M252 271 L 428 271"/>
    </g>
    <path d="M252 271 C 340 271, 340 423, 428 423" fill="none" stroke="#BF3B24" stroke-width="1.8" opacity=".55"/>

    <g stroke="none">
      <circle class="m1" cx="256" cy="271" r="5.5" fill="#5A5449"/>
      <circle class="m2" cx="256" cy="271" r="5.5" fill="#5A5449"/>
      <circle class="m3" cx="256" cy="271" r="6.5" fill="#BF3B24"/>
    </g>

    <rect x="428" y="88" width="542" height="82" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5" rx="3"/>
    <text x="452" y="116" fill="#1B1712" font-size="14">DELETED</text>
    <text x="452" y="140" fill="#5A5449" font-size="12">the prototype answered its question, and the answer was</text>
    <text x="452" y="158" fill="#5A5449" font-size="12">the note you wrote, not the code</text>
    <text x="946" y="116" fill="#8A8578" font-size="10.5" letter-spacing="2" text-anchor="end">HONEST</text>

    <rect x="428" y="230" width="542" height="82" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5" rx="3"/>
    <text x="452" y="258" fill="#1B1712" font-size="14">ADOPTED</text>
    <text x="452" y="282" fill="#5A5449" font-size="12">somebody read it, owns it, and can change it next quarter</text>
    <text x="452" y="300" fill="#5A5449" font-size="12">without re-deriving what it does</text>
    <text x="946" y="258" fill="#8A8578" font-size="10.5" letter-spacing="2" text-anchor="end">HONEST</text>

    <rect class="pulse" x="428" y="378" width="542" height="90" fill="#F5F1E8" stroke="#BF3B24" rx="3"/>
    <text x="452" y="406" fill="#BF3B24" font-size="14">RETAINED, NOT ADOPTED</text>
    <text x="452" y="430" fill="#5A5449" font-size="12">in production, in git blame, in nobody's head</text>
    <text class="drift" x="452" y="452" fill="#BF3B24" font-size="12">nobody decided this — it is what the other two cost</text>
    <text x="946" y="406" fill="#BF3B24" font-size="10.5" letter-spacing="2" text-anchor="end">THE DEFAULT</text>
  </g>
</svg>
