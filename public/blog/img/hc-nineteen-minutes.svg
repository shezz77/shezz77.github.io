<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="A line chart over twenty-five minutes with one percentage axis. The load balancer's healthy-target percentage stays flat at one hundred percent for the entire window. Request success rate holds at one hundred percent until minute three, falls to about sixty-two percent by minute six, stays there for sixteen minutes, and recovers at minute twenty-two. A shaded band marks the nineteen minutes during which the two lines disagree and no alert fired.">
  <style>
    .draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 9s ease-out infinite; }
    .d2 { animation-delay: .9s; }
    @keyframes draw { 0%,4%{stroke-dashoffset:100} 34%,92%{stroke-dashoffset:0} 99%,100%{stroke-dashoffset:100} }
    .fade { animation: fade 9s ease-out infinite; opacity: 0; }
    .f2 { animation-delay: 1.6s; }
    @keyframes fade { 0%,20%{opacity:0} 38%,92%{opacity:1} 99%,100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .fade { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="470" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="34" fill="#BF3B24" font-size="13" letter-spacing="3">NINETEEN MINUTES, TWO STORIES</text>
    <text x="30" y="56" fill="#8A8578" font-size="11.5">one axis, both series in percent &#183; no alert fired at any point on this chart</text>

    <g class="fade">
      <rect x="90" y="72" width="14" height="3" fill="#E0A458"/>
      <text x="112" y="78" fill="#443E35" font-size="11.5">ALB healthy targets</text>
      <rect x="290" y="72" width="14" height="3" fill="#BF3B24"/>
      <text x="312" y="78" fill="#443E35" font-size="11.5">request success rate</text>
    </g>

    <rect x="190.8" y="90" width="638.4" height="260" fill="#BF3B24" opacity=".05"/>
    <line x1="90" y1="350.0" x2="930" y2="350.0" stroke="#E4DBCB" stroke-width="1"/>
    <text x="78" y="354.0" text-anchor="end" fill="#A79E8C" font-size="11">0%</text>
    <line x1="90" y1="290.9" x2="930" y2="290.9" stroke="#E4DBCB" stroke-width="1"/>
    <text x="78" y="294.9" text-anchor="end" fill="#A79E8C" font-size="11">25%</text>
    <line x1="90" y1="231.8" x2="930" y2="231.8" stroke="#E4DBCB" stroke-width="1"/>
    <text x="78" y="235.8" text-anchor="end" fill="#A79E8C" font-size="11">50%</text>
    <line x1="90" y1="172.7" x2="930" y2="172.7" stroke="#E4DBCB" stroke-width="1"/>
    <text x="78" y="176.7" text-anchor="end" fill="#A79E8C" font-size="11">75%</text>
    <line x1="90" y1="113.6" x2="930" y2="113.6" stroke="#E4DBCB" stroke-width="1"/>
    <text x="78" y="117.6" text-anchor="end" fill="#A79E8C" font-size="11">100%</text>
    <line x1="90" y1="90" x2="90" y2="350" stroke="#D6CBB6" stroke-width="1.5"/>
    <text x="90.0" y="372" text-anchor="middle" fill="#A79E8C" font-size="11">0</text>
    <text x="258.0" y="372" text-anchor="middle" fill="#A79E8C" font-size="11">5</text>
    <text x="426.0" y="372" text-anchor="middle" fill="#A79E8C" font-size="11">10</text>
    <text x="594.0" y="372" text-anchor="middle" fill="#A79E8C" font-size="11">15</text>
    <text x="762.0" y="372" text-anchor="middle" fill="#A79E8C" font-size="11">20</text>
    <text x="930.0" y="372" text-anchor="middle" fill="#A79E8C" font-size="11">25</text>
    <text x="510" y="392" text-anchor="middle" fill="#8A8578" font-size="11">minutes into the incident</text>

    <polyline class="draw" pathLength="100" points="90.0,113.6 930.0,113.6" fill="none" stroke="#E0A458" stroke-width="2.5"/>
    <polyline class="draw d2" pathLength="100" points="90.0,113.6 123.6,113.6 157.2,113.6 190.8,116.0 224.4,142.0 258.0,182.2 291.6,198.7 325.2,201.1 358.8,194.0 392.4,203.5 426.0,196.4 459.6,201.1 493.2,205.8 526.8,198.7 560.4,203.5 594.0,194.0 627.6,201.1 661.2,196.4 694.8,198.7 728.4,191.6 762.0,165.6 795.6,127.8 829.2,113.6 862.8,113.6 896.4,113.6 930.0,113.6" fill="none" stroke="#BF3B24" stroke-width="2.5"/>

    <g class="fade f2">
      <text x="460" y="103" fill="#7A6A3F" font-size="12">100% healthy, the whole time</text>
      <text x="392" y="227" fill="#BF3B24" font-size="12">62% of writes failing</text>
      <line x1="190.8" y1="362" x2="829.2" y2="362" stroke="#BF3B24" stroke-width="1.5"/>
      <text x="510" y="357" text-anchor="middle" fill="#BF3B24" font-size="11.5">19 minutes</text>
    </g>

    <line x1="30" y1="412" x2="970" y2="412" stroke="#E4DBCB" stroke-width="1"/>
    <text x="30" y="440" fill="#1B1712" font-size="13.5">The amber line is what every dashboard showed. It was accurate about nginx and silent about the application</text>
    <text x="30" y="460" fill="#1B1712" font-size="13.5">behind it, which is the only thing anybody wanted to know.</text>
  </g>
</svg>