<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="A four-gate defensive architecture for running autonomous coding agents safely in production. Gate 1 is Spec as Code: interface contracts, OpenAPI schemas, and strict file allowlists. Gate 2 is the Hermetic Sandbox: containerized execution, stripped environment secrets, and strict egress filtering. Gate 3 is Structural Guardrails: dependency freeze, domain boundary linting, and diff caps under 250 lines. Gate 4 is Intent Review: reviewing prompts and design choices rather than just syntax, enforcing developer ownership. Sequential animations highlight each gate in order.">
  <defs>
    <marker id="garr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8578"/>
    </marker>
  </defs>
  <style>
    .gate-glow { animation: gatepulse 8s ease-in-out infinite; opacity: 0; }
    .g1 { animation-delay: 0s; }
    .g2 { animation-delay: 2s; }
    .g3 { animation-delay: 4s; }
    .g4 { animation-delay: 6s; }
    @keyframes gatepulse {
      0%, 4%   { opacity: 0; }
      10%, 25% { opacity: 1; }
      32%, 100%{ opacity: 0; }
    }
    .flow-line { stroke-dasharray: 5 4; animation: flowline 1.2s linear infinite; }
    @keyframes flowline { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) {
      .gate-glow { animation: none; opacity: 0; }
      .flow-line { animation: none; }
    }
  </style>
  <rect width="1000" height="480" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <!-- Header -->
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">THE DEFENSIVE SDLC: FOUR GATES FOR AGENTS</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Treat the agent as a tireless junior contractor with no long-term memory.</text>

    <!-- 4 Columns for the 4 Gates -->

    <!-- GATE 1: Spec as Code -->
    <g>
      <rect x="30" y="90" width="216" height="310" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5" rx="3"/>
      <rect class="gate-glow g1" x="27" y="87" width="222" height="316" fill="none" stroke="#BF3B24" stroke-width="2.5" rx="4"/>
      <text x="46" y="118" fill="#BF3B24" font-size="11" letter-spacing="1.5">GATE 1</text>
      <text x="46" y="138" fill="#1B1712" font-size="13.5">Spec as Code</text>
      <text x="46" y="156" fill="#8A8578" font-size="10.5">INPUT CONTRACT</text>

      <line x1="46" y1="168" x2="230" y2="168" stroke="#D6CBB6" stroke-width="1"/>

      <text x="46" y="194" fill="#1B1712" font-size="11.5">• Explicit types</text>
      <text x="46" y="214" fill="#5A5449" font-size="10.5">  OpenAPI / TS types</text>
      <text x="46" y="244" fill="#1B1712" font-size="11.5">• Scoped allowlist</text>
      <text x="46" y="264" fill="#5A5449" font-size="10.5">  touch only 3 files</text>
      <text x="46" y="294" fill="#1B1712" font-size="11.5">• Invariants first</text>
      <text x="46" y="314" fill="#5A5449" font-size="10.5">  tests define done</text>

      <rect x="44" y="348" width="188" height="36" fill="#FCFAF4" stroke="#D6CBB6" stroke-width="1" rx="2"/>
      <text x="138" y="371" text-anchor="middle" fill="#5A5449" font-size="10">Blocks prompt drift</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="246" y1="245" x2="270" y2="245" stroke="#E0A458" stroke-width="2" class="flow-line" marker-end="url(#garr)"/>

    <!-- GATE 2: Hermetic Sandbox -->
    <g>
      <rect x="274" y="90" width="216" height="310" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5" rx="3"/>
      <rect class="gate-glow g2" x="271" y="87" width="222" height="316" fill="none" stroke="#BF3B24" stroke-width="2.5" rx="4"/>
      <text x="290" y="118" fill="#E0A458" font-size="11" letter-spacing="1.5">GATE 2</text>
      <text x="290" y="138" fill="#1B1712" font-size="13.5">Hermetic Box</text>
      <text x="290" y="156" fill="#8A8578" font-size="10.5">EXECUTION BOUNDARY</text>

      <line x1="290" y1="168" x2="474" y2="168" stroke="#D6CBB6" stroke-width="1"/>

      <text x="290" y="194" fill="#1B1712" font-size="11.5">• Container/VM</text>
      <text x="290" y="214" fill="#5A5449" font-size="10.5">  no host FS mounts</text>
      <text x="290" y="244" fill="#1B1712" font-size="11.5">• Zero env keys</text>
      <text x="290" y="264" fill="#5A5449" font-size="10.5">  strip .env / tokens</text>
      <text x="290" y="294" fill="#1B1712" font-size="11.5">• Egress filtering</text>
      <text x="290" y="314" fill="#5A5449" font-size="10.5">  block raw internet</text>

      <rect x="288" y="348" width="188" height="36" fill="#FCFAF4" stroke="#D6CBB6" stroke-width="1" rx="2"/>
      <text x="382" y="371" text-anchor="middle" fill="#5A5449" font-size="10">Blocks prompt exfil</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="490" y1="245" x2="514" y2="245" stroke="#E0A458" stroke-width="2" class="flow-line" marker-end="url(#garr)"/>

    <!-- GATE 3: Structural Guards -->
    <g>
      <rect x="518" y="90" width="216" height="310" fill="#F5F1E8" stroke="#D6CBB6" stroke-width="1.5" rx="3"/>
      <rect class="gate-glow g3" x="515" y="87" width="222" height="316" fill="none" stroke="#BF3B24" stroke-width="2.5" rx="4"/>
      <text x="534" y="118" fill="#BF3B24" font-size="11" letter-spacing="1.5">GATE 3</text>
      <text x="534" y="138" fill="#1B1712" font-size="13.5">Structural CI</text>
      <text x="534" y="156" fill="#8A8578" font-size="10.5">AUTOMATED ENFORCEMENT</text>

      <line x1="534" y1="168" x2="718" y2="168" stroke="#D6CBB6" stroke-width="1"/>

      <text x="534" y="194" fill="#1B1712" font-size="11.5">• Lockfile freeze</text>
      <text x="534" y="214" fill="#5A5449" font-size="10.5">  fail on new pkg</text>
      <text x="534" y="244" fill="#1B1712" font-size="11.5">• Arch boundaries</text>
      <text x="534" y="264" fill="#5A5449" font-size="10.5">  no cross-domain calls</text>
      <text x="534" y="294" fill="#1B1712" font-size="11.5">• Diff budget</text>
      <text x="534" y="314" fill="#5A5449" font-size="10.5">  max 250 lines/PR</text>

      <rect x="532" y="348" width="188" height="36" fill="#FCFAF4" stroke="#D6CBB6" stroke-width="1" rx="2"/>
      <text x="626" y="371" text-anchor="middle" fill="#5A5449" font-size="10">Blocks slop sprawl</text>
    </g>

    <!-- Connector 3 -> 4 -->
    <line x1="734" y1="245" x2="758" y2="245" stroke="#E0A458" stroke-width="2" class="flow-line" marker-end="url(#garr)"/>

    <!-- GATE 4: Intent Review -->
    <g>
      <rect x="762" y="90" width="208" height="310" fill="#F5F1E8" stroke="#1B1712" stroke-width="1.8" rx="3"/>
      <rect class="gate-glow g4" x="759" y="87" width="214" height="316" fill="none" stroke="#BF3B24" stroke-width="2.5" rx="4"/>
      <text x="778" y="118" fill="#BF3B24" font-size="11" letter-spacing="1.5">GATE 4</text>
      <text x="778" y="138" fill="#1B1712" font-size="13.5">Intent Review</text>
      <text x="778" y="156" fill="#8A8578" font-size="10.5">HUMAN SIGN-OFF</text>

      <line x1="778" y1="168" x2="956" y2="168" stroke="#D6CBB6" stroke-width="1"/>

      <text x="778" y="194" fill="#1B1712" font-size="11.5">• Review prompt</text>
      <text x="778" y="214" fill="#5A5449" font-size="10.5">  audit intent &amp; plan</text>
      <text x="778" y="244" fill="#1B1712" font-size="11.5">• Ban monkey-patch</text>
      <text x="778" y="264" fill="#5A5449" font-size="10.5">  no hacky test-fixes</text>
      <text x="778" y="294" fill="#1B1712" font-size="11.5">• You own the diff</text>
      <text x="778" y="314" fill="#5A5449" font-size="10.5">  human accountability</text>

      <rect x="772" y="348" width="188" height="36" fill="#1B1712" rx="2"/>
      <text x="866" y="371" text-anchor="middle" fill="#F5F1E8" font-size="10">Blocks silent debt</text>
    </g>

    <!-- Bottom rule -->
    <line x1="30" y1="426" x2="970" y2="426" stroke="#E4DBCB" stroke-width="1"/>
    <text x="30" y="456" fill="#1B1712" font-size="12.5">When writing is free, guardrails cannot be voluntary. Automate the checks, review the intent.</text>
  </g>
</svg>
