<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Two orderings of the same ten prompts. The order as listed runs one to ten, which builds the course before the diagnostic. The order that works runs prompt two to diagnose, then one and six to plan, then three and five to teach, then seven to practise, nine to space the recall, eight to examine and ten to prove, with a return arc from the end back to the diagnostic rather than back to the plan.">
  <style>
    .spine { stroke: #BF3B24; stroke-width: 2.5; fill: none; stroke-dasharray: 16 104; animation: travel 3.6s linear infinite; }
    .arc { stroke: #B9A98C; stroke-width: 2; fill: none; stroke-dasharray: 10 8; animation: travelback 5s linear infinite; }
    @keyframes travel { to { stroke-dashoffset: -120; } }
    @keyframes travelback { to { stroke-dashoffset: 36; } }
    .node { animation: node 10.5s ease-in-out infinite; }
    .n2 { animation-delay: .5s; } .n3 { animation-delay: 1s; } .n4 { animation-delay: 1.5s; }
    .n5 { animation-delay: 2s; } .n6 { animation-delay: 2.5s; } .n7 { animation-delay: 3s; }
    @keyframes node {
      0%, 2%    { stroke: #D6CBB6; stroke-width: 2; }
      6%, 22%   { stroke: #BF3B24; stroke-width: 3.5; }
      28%, 100% { stroke: #D6CBB6; stroke-width: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spine, .arc { animation: none; stroke-dasharray: none; }
      .node { animation: none; stroke: #D6CBB6; stroke-width: 2; }
    }
  </style>
  <rect width="1000" height="470" fill="#FCFAF4"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">THE NUMBERING IS NOT THE RUNNING ORDER</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Run them one to ten and the syllabus is written before anybody has asked what you already know</text>

    <text x="30" y="100" fill="#8A8578" font-size="11.5" letter-spacing="2">AS LISTED</text>
    <g fill="#F1ECE0" stroke="#E2DACA" stroke-width="1.5">
      <rect x="32" y="112" width="88" height="42"/><rect x="126" y="112" width="88" height="42"/>
      <rect x="220" y="112" width="88" height="42"/><rect x="314" y="112" width="88" height="42"/>
      <rect x="408" y="112" width="88" height="42"/><rect x="502" y="112" width="88" height="42"/>
      <rect x="596" y="112" width="88" height="42"/><rect x="690" y="112" width="88" height="42"/>
      <rect x="784" y="112" width="88" height="42"/><rect x="878" y="112" width="88" height="42"/>
    </g>
    <g fill="#A79C88" font-size="15" text-anchor="middle">
      <text x="76" y="139">1</text><text x="170" y="139">2</text><text x="264" y="139">3</text>
      <text x="358" y="139">4</text><text x="452" y="139">5</text><text x="546" y="139">6</text>
      <text x="640" y="139">7</text><text x="734" y="139">8</text><text x="828" y="139">9</text>
      <text x="922" y="139">10</text>
    </g>
    <text x="32" y="176" fill="#8A8578" font-size="11">plan first, measure later &#8212; a syllabus for the average stranger</text>

    <text x="30" y="212" fill="#BF3B24" font-size="11.5" letter-spacing="2">AS IT SHOULD RUN</text>

    <path class="spine" d="M 92 238 L 908 238"/>
    <g stroke="#E2DACA" stroke-width="1.5">
      <path d="M 92 238 L 92 256"/><path d="M 228 238 L 228 256"/><path d="M 364 238 L 364 256"/>
      <path d="M 500 238 L 500 256"/><path d="M 636 238 L 636 256"/><path d="M 772 238 L 772 256"/>
      <path d="M 908 238 L 908 256"/>
    </g>

    <g fill="#F5F1E8">
      <rect class="node"    x="32"  y="256" width="120" height="80"/>
      <rect class="node n2" x="168" y="256" width="120" height="80"/>
      <rect class="node n3" x="304" y="256" width="120" height="80"/>
      <rect class="node n4" x="440" y="256" width="120" height="80"/>
      <rect class="node n5" x="576" y="256" width="120" height="80"/>
      <rect class="node n6" x="712" y="256" width="120" height="80"/>
      <rect class="node n7" x="848" y="256" width="120" height="80"/>
    </g>
    <g text-anchor="middle" font-size="16" fill="#BF3B24">
      <text x="92" y="290">2</text><text x="228" y="290">1 &#183; 6</text><text x="364" y="290">3 &#183; 5</text>
      <text x="500" y="290">7</text><text x="636" y="290">9</text><text x="772" y="290">8</text>
      <text x="908" y="290">10</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#1B1712">
      <text x="92" y="314">diagnose</text><text x="228" y="314">plan</text><text x="364" y="314">teach</text>
      <text x="500" y="314">practise</text><text x="636" y="314">space</text><text x="772" y="314">examine</text>
      <text x="908" y="314">prove</text>
    </g>

    <path class="arc" d="M 908 336 L 908 372 Q 908 384 896 384 L 104 384 Q 92 384 92 372 L 92 348"/>
    <polygon points="86,352 98,352 92,338" fill="#B9A98C"/>
    <text x="500" y="408" fill="#8A8578" font-size="11.5" text-anchor="middle">the capstone sends you back to the diagnostic, not to the plan</text>

    <text x="30" y="446" fill="#1B1712" font-size="13.5">One reordering, no new prompts. It is the difference between a syllabus about the topic and a syllabus about you.</text>
  </g>
</svg>
