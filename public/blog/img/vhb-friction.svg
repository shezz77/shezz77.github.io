<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">Faster individual work, persistent workflow friction</title><desc id="desc">87% report faster shipping and 72% report same or more friction. Separate questions, shared zero-to-100-percent scale.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.mono { font-family: 'IBM Plex Mono', Menlo, monospace; letter-spacing: 2px; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
.second { animation-delay: .25s; }
.reveal { animation: reveal .8s ease-out both; }
.r1 { animation-delay: .3s; } .r2 { animation-delay: .8s; } .r3 { animation-delay: 1.3s; } .r4 { animation-delay: 1.8s; } .r5 { animation-delay: 2.3s; }
.packet { animation: travel 3.5s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes reveal { from { opacity: .15; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes travel { 0% { transform: translateX(-110px); opacity: 0; } 15% { opacity: 1; } 80%,100% { transform: translateX(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .grow,.reveal,.packet { animation: none; transform: none; opacity: 1; } }
</style>
<rect x="0" y="0" width="800" height="560" fill="#FCFAF4" /><rect x="0" y="0" width="800" height="7" fill="#BF3B24" />
<text x="40" y="58" font-size="21" fill="#BF3B24" font-weight="700" class="mono">FASTER. STILL STUCK.</text><text x="40" y="111" font-size="34" fill="#1B1712" font-weight="700" >Two truths in the same survey</text><text x="40" y="153" font-size="23" fill="#5A5449" font-weight="400" >Developer responses · Atlassian 2026</text><text x="40" y="230" font-size="27" fill="#1B1712" font-weight="700" >AI helps ship work faster</text><rect x="40" y="248" width="720" height="42" fill="#F5F1E8" /><rect x="40" y="248" width="626.4" height="42" fill="#365A49" class="grow"/><text x="754" y="229" font-size="40" fill="#365A49" font-weight="700" text-anchor="end">87%</text><text x="40" y="370" font-size="27" fill="#1B1712" font-weight="700" >Same or more workflow friction</text><rect x="40" y="388" width="720" height="42" fill="#F5F1E8" /><rect x="40" y="388" width="518.4" height="42" fill="#BF3B24" class="grow second"/><text x="754" y="369" font-size="40" fill="#BF3B24" font-weight="700" text-anchor="end">72%</text><text x="40.0" y="478" font-size="19" fill="#5A5449" font-weight="400" text-anchor="middle">0</text><text x="220.0" y="478" font-size="19" fill="#5A5449" font-weight="400" text-anchor="middle">25</text><text x="400.0" y="478" font-size="19" fill="#5A5449" font-weight="400" text-anchor="middle">50</text><text x="580.0" y="478" font-size="19" fill="#5A5449" font-weight="400" text-anchor="middle">75</text><text x="760.0" y="478" font-size="19" fill="#5A5449" font-weight="400" text-anchor="middle">100%</text><line x1="40" y1="451" x2="760" y2="451" stroke="#D6CBB6" /><text x="40" y="517" font-size="23" fill="#5A5449" font-weight="400" >Separate questions; responses can overlap.</text><text x="40" y="546" font-size="18" fill="#5A5449" font-weight="400" >Source: Atlassian, October 2026 · self-reported experience</text>
</svg>