    <text x="30" y="38" fill="#BF3B24" font-size="13" letter-spacing="3">ARGON WINS THE LONG JOBS, LOSES THE HARD SHELL ONES</text>
    <text x="30" y="62" fill="#8A8578" font-size="11.5">Seven of the model card's 19 rows. Pick the model by the shape of the task, not by the headline.</text>

