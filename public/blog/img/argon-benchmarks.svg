<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-label="Grouped bar chart of seven vendor-reported benchmarks comparing Gemini 4 Argon, Claude Opus 5.5 and GPT-6 Astra. Where Argon leads: DeepSWE v1.1, Argon 77.9 percent, Opus 5.5 74.2, Astra 74.1. Vals Index, 68.9, 67.0 and 63.1. AutomationBench, 51.3, 42.5 and 41.4. GraphWalks from 256 thousand to 1 million tokens, 84.2, 66.8 and 71.8. Where Argon trails: FrontierSWE v2, Argon 55.0, Opus 62.3, Astra 65.5. Terminal-Bench 4.0, 57.4, 66.4 and 58.2. Terminal-Bench Science, 57.6, 63.3 and 68.1. Argon wins long-context and knowledge work and loses the hard, novel and shell-heavy coding tasks. Source: the Gemini 4 Argon model card. Independently, Artificial Analysis puts Argon at 53, tied with GPT-6 Astra, with Opus 5.5 ahead at 58.">
  <style>
    .b { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .v { animation: fade .6s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .b, .v { animation: none; } }
  </style>
  <rect width="1000" height="650" fill="#FCFAF4"/>
