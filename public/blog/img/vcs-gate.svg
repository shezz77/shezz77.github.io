<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
<title id="title">The five-door launch gate</title><desc id="desc">A proposed pre-launch security gate with five checks, each mapped to a reported incident it targets. One: the two-account test, where a second user and an anonymous request try to read and change the first user's data; targets missing row level security as at Moltbook and Lovable apps in 2025. Two: default private, confirming that share links, previews and project pages require sign-in; targets platform defaults as at Grok Build and the Lovable regression. Three: agent blast radius, giving coding agents separate development data and no production credentials; targets the Replit production deletion. Four: dependency proof, checking every new package exists, is established and is pinned in a lockfile; targets slopsquatting. Five: secret sweep, scanning the shipped bundle, repository and chat history for keys and rotating anything found. A change passes to launch only when all five doors are closed.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.mono { font-family: 'IBM Plex Mono', Menlo, monospace; letter-spacing: 2px; }
.reveal { animation: reveal .6s ease-out both; }
.r1 { animation-delay: .2s; } .r2 { animation-delay: .6s; } .r3 { animation-delay: 1s; } .r4 { animation-delay: 1.4s; } .r5 { animation-delay: 1.8s; } .r6 { animation-delay: 2.4s; }
.tick { stroke-dasharray: 30; stroke-dashoffset: 30; animation: tick .4s ease-out forwards; }
.t1 { animation-delay: .7s; } .t2 { animation-delay: 1.1s; } .t3 { animation-delay: 1.5s; } .t4 { animation-delay: 1.9s; } .t5 { animation-delay: 2.3s; }
@keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes tick { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .reveal,.tick { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; } }
</style>
<rect width="800" height="900" fill="#FCFAF4"/><rect width="800" height="7" fill="#BF3B24"/>
<text x="40" y="58" font-size="20" fill="#BF3B24" font-weight="700" class="mono">THE SOLUTION</text>
<text x="40" y="106" font-size="34" fill="#1B1712" font-weight="700">The five-door launch gate</text>
<text x="40" y="142" font-size="20" fill="#5A5449">Close each door before real users arrive</text>

<g class="reveal r1"><rect x="40" y="172" width="720" height="118" rx="8" fill="#F5F1E8" stroke="#D6CBB6"/>
<rect x="40" y="172" width="10" height="118" rx="4" fill="#BF3B24"/>
<text x="72" y="208" font-size="15" fill="#5A5449" class="mono">DOOR 1 · DATA</text>
<text x="72" y="240" font-size="24" fill="#1B1712" font-weight="700">Two-account test</text>
<text x="72" y="270" font-size="17" fill="#5A5449">User B and a logged-out request try to read and edit A's rows</text>
<circle cx="716" cy="230" r="22" fill="#FCFAF4" stroke="#365A49" stroke-width="3"/><path d="M705 231 l8 8 l15 -16" fill="none" stroke="#365A49" stroke-width="4" class="tick t1"/></g>

<g class="reveal r2"><rect x="40" y="306" width="720" height="118" rx="8" fill="#F5F1E8" stroke="#D6CBB6"/>
<rect x="40" y="306" width="10" height="118" rx="4" fill="#BF3B24"/>
<text x="72" y="342" font-size="15" fill="#5A5449" class="mono">DOOR 2 · DEFAULTS</text>
<text x="72" y="374" font-size="24" fill="#1B1712" font-weight="700">Default private</text>
<text x="72" y="404" font-size="17" fill="#5A5449">Open every share link, preview and project page in a private window</text>
<circle cx="716" cy="364" r="22" fill="#FCFAF4" stroke="#365A49" stroke-width="3"/><path d="M705 365 l8 8 l15 -16" fill="none" stroke="#365A49" stroke-width="4" class="tick t2"/></g>

<g class="reveal r3"><rect x="40" y="440" width="720" height="118" rx="8" fill="#F5F1E8" stroke="#D6CBB6"/>
<rect x="40" y="440" width="10" height="118" rx="4" fill="#BF3B24"/>
<text x="72" y="476" font-size="15" fill="#5A5449" class="mono">DOOR 3 · AGENTS</text>
<text x="72" y="508" font-size="24" fill="#1B1712" font-weight="700">Agent blast radius</text>
<text x="72" y="538" font-size="17" fill="#5A5449">Separate dev data; no production credentials; backups you've restored</text>
<circle cx="716" cy="498" r="22" fill="#FCFAF4" stroke="#365A49" stroke-width="3"/><path d="M705 499 l8 8 l15 -16" fill="none" stroke="#365A49" stroke-width="4" class="tick t3"/></g>

<g class="reveal r4"><rect x="40" y="574" width="720" height="118" rx="8" fill="#F5F1E8" stroke="#D6CBB6"/>
<rect x="40" y="574" width="10" height="118" rx="4" fill="#BF3B24"/>
<text x="72" y="610" font-size="15" fill="#5A5449" class="mono">DOOR 4 · SUPPLY CHAIN</text>
<text x="72" y="642" font-size="24" fill="#1B1712" font-weight="700">Dependency proof</text>
<text x="72" y="672" font-size="17" fill="#5A5449">Every new package exists, has history, and is pinned in a lockfile</text>
<circle cx="716" cy="632" r="22" fill="#FCFAF4" stroke="#365A49" stroke-width="3"/><path d="M705 633 l8 8 l15 -16" fill="none" stroke="#365A49" stroke-width="4" class="tick t4"/></g>

<g class="reveal r5"><rect x="40" y="708" width="720" height="118" rx="8" fill="#F5F1E8" stroke="#D6CBB6"/>
<rect x="40" y="708" width="10" height="118" rx="4" fill="#BF3B24"/>
<text x="72" y="744" font-size="15" fill="#5A5449" class="mono">DOOR 5 · SECRETS</text>
<text x="72" y="776" font-size="24" fill="#1B1712" font-weight="700">Secret sweep</text>
<text x="72" y="806" font-size="17" fill="#5A5449">Scan the bundle, repo and chat history; rotate anything you find</text>
<circle cx="716" cy="766" r="22" fill="#FCFAF4" stroke="#365A49" stroke-width="3"/><path d="M705 767 l8 8 l15 -16" fill="none" stroke="#365A49" stroke-width="4" class="tick t5"/></g>

<g class="reveal r6"><rect x="40" y="842" width="720" height="40" rx="20" fill="#1B1712"/>
<text x="400" y="868" font-size="16" fill="#FCFAF4" text-anchor="middle" class="mono">ALL FIVE CLOSED → LAUNCH</text></g>
</svg>
