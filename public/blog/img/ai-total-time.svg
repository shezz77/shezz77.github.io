<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title"><title id="title">Hypothetical total task time: vague request 20 minutes, clear brief 12 minutes</title><style>.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.5s ease-out both}.second{animation-delay:.3s}.step{animation:step 1s ease-out both}.s2{animation-delay:.7s}.s3{animation-delay:1.4s}.s4{animation-delay:2.1s}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes step{from{opacity:.25}to{opacity:1}}@media(prefers-reduced-motion:reduce){.grow,.step{animation:none}}</style><rect x="0" y="0" width="800" height="480" fill="#FCFAF4" /><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="17" fill="#BF3B24" letter-spacing="2">COUNT THE WHOLE TASK</text><text x="32" y="78" font-size="26" fill="#1B1712" >Fast to draft does not mean fast to finish.</text><text x="32" y="109" font-size="16" fill="#5A5449" >ILLUSTRATIVE VALUES — NOT MEASURED RESULTS</text><path d="M220 140 V310" stroke="#E4DBCB"/><text x="220" y="340" font-size="18" fill="#5A5449" text-anchor="middle">0</text><path d="M340 140 V310" stroke="#E4DBCB"/><text x="340" y="340" font-size="18" fill="#5A5449" text-anchor="middle">5</text><path d="M460 140 V310" stroke="#E4DBCB"/><text x="460" y="340" font-size="18" fill="#5A5449" text-anchor="middle">10</text><path d="M580 140 V310" stroke="#E4DBCB"/><text x="580" y="340" font-size="18" fill="#5A5449" text-anchor="middle">15</text><path d="M700 140 V310" stroke="#E4DBCB"/><text x="700" y="340" font-size="18" fill="#5A5449" text-anchor="middle">20</text><text x="32" y="186" font-size="21" fill="#1B1712" >Vague request</text><text x="32" y="276" font-size="21" fill="#1B1712" >Clear brief</text><rect x="220" y="155" width="24" height="45" fill="#8F8068" class="grow"/><rect x="244" y="155" width="24" height="45" fill="#1B1712" class="grow"/><rect x="268" y="155" width="432" height="45" fill="#BF3B24" class="grow"/><text x="712" y="185" font-size="20" fill="#1B1712" >20 min</text><rect x="220" y="245" width="96" height="45" fill="#8F8068" class="grow"/><rect x="316" y="245" width="24" height="45" fill="#1B1712" class="grow"/><rect x="340" y="245" width="168" height="45" fill="#BF3B24" class="grow"/><text x="520" y="275" font-size="20" fill="#1B1712" >12 min</text><text x="220" y="375" font-size="18" fill="#5A5449" >Total time per task (minutes)</text><rect x="32" y="405" width="20" height="20" fill="#8F8068" /><text x="62" y="422" font-size="20" fill="#1B1712" >Brief</text><rect x="262" y="405" width="20" height="20" fill="#1B1712" /><text x="292" y="422" font-size="20" fill="#1B1712" >Draft</text><rect x="492" y="405" width="20" height="20" fill="#BF3B24" /><text x="522" y="422" font-size="20" fill="#1B1712" >Check + fix</text><text x="32" y="460" font-size="19" fill="#5A5449" >Example inputs: 1 + 1 + 18 minutes versus 4 + 1 + 7.</text></g></svg>