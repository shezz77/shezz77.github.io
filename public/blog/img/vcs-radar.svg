<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">CVEs traced to AI-authored commits, early 2026</title><desc id="desc">Georgia Tech's Vibe Security Radar, as reported by Infosecurity Magazine and the Cloud Security Alliance: published vulnerabilities traced back to AI-authored commits rose from 6 in January 2026 to 15 in February and 35 in March. Bars share a zero baseline on a 0 to 40 scale. The radar only detects commits that carry AI metadata, so its authors say the real number is higher; rising counts also reflect rising AI tool use.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.mono { font-family: 'IBM Plex Mono', Menlo, monospace; letter-spacing: 2px; }
.grow { transform-box: fill-box; transform-origin: center bottom; animation: grow 1s ease-out both; }
.g2 { animation-delay: .35s; } .g3 { animation-delay: .7s; }
.fade { animation: fade .6s ease-out 1.6s both; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .grow,.fade { animation: none; transform: none; opacity: 1; } }
</style>
<rect width="800" height="560" fill="#FCFAF4"/><rect width="800" height="7" fill="#BF3B24"/>
<text x="40" y="56" font-size="19" fill="#BF3B24" font-weight="700" class="mono">THE VOLUME PROBLEM</text>
<text x="40" y="102" font-size="31" fill="#1B1712" font-weight="700">CVEs traced to AI-authored commits</text>
<text x="40" y="136" font-size="19" fill="#5A5449">Georgia Tech Vibe Security Radar · confirmed per month, 2026</text>
<!-- axis: 0..40 over y 470..190 (7px per unit) -->
<line x1="90" y1="470" x2="760" y2="470" stroke="#D6CBB6" stroke-width="2"/>
<line x1="90" y1="400" x2="760" y2="400" stroke="#EDE6D8"/><line x1="90" y1="330" x2="760" y2="330" stroke="#EDE6D8"/><line x1="90" y1="260" x2="760" y2="260" stroke="#EDE6D8"/><line x1="90" y1="190" x2="760" y2="190" stroke="#EDE6D8"/>
<text x="78" y="475" font-size="15" fill="#5A5449" text-anchor="end">0</text><text x="78" y="405" font-size="15" fill="#5A5449" text-anchor="end">10</text><text x="78" y="335" font-size="15" fill="#5A5449" text-anchor="end">20</text><text x="78" y="265" font-size="15" fill="#5A5449" text-anchor="end">30</text><text x="78" y="195" font-size="15" fill="#5A5449" text-anchor="end">40</text>
<rect x="140" y="428" width="140" height="42" fill="#E0A458" class="grow"/>
<rect x="355" y="365" width="140" height="105" fill="#C9763E" class="grow g2"/>
<rect x="570" y="225" width="140" height="245" fill="#BF3B24" class="grow g3"/>
<text x="210" y="416" font-size="30" fill="#1B1712" font-weight="700" text-anchor="middle">6</text>
<text x="425" y="353" font-size="30" fill="#1B1712" font-weight="700" text-anchor="middle">15</text>
<text x="640" y="213" font-size="30" fill="#BF3B24" font-weight="700" text-anchor="middle">35</text>
<text x="210" y="498" font-size="17" fill="#5A5449" text-anchor="middle" class="mono">JAN</text>
<text x="425" y="498" font-size="17" fill="#5A5449" text-anchor="middle" class="mono">FEB</text>
<text x="640" y="498" font-size="17" fill="#5A5449" text-anchor="middle" class="mono">MAR</text>
<text x="40" y="534" font-size="15" fill="#5A5449" class="fade">Only commits with AI metadata are detectable; the authors say the true count is higher.</text>
