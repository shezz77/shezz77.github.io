<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#17130E"/>
  <rect width="1200" height="12" fill="#BF3B24"/>

  <g font-family="IBM Plex Mono, Menlo, monospace">
