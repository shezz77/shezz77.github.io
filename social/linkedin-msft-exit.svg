  <rect x="80" y="716" width="1040" height="334" fill="#221C15" stroke="#3A332A" stroke-width="2" rx="6"/>
  <circle cx="118" cy="758" r="8" fill="#BF3B24"/>
  <circle cx="148" cy="758" r="8" fill="#E0A458"/>
  <circle cx="178" cy="758" r="8" fill="#5A5449"/>
  <text x="1090" y="766" fill="#5A5449" font-family="IBM Plex Mono, Menlo, monospace" font-size="22" text-anchor="end">microsoft · 2026 · people, one scale</text>
  <line x1="80" y1="786" x2="1120" y2="786" stroke="#3A332A" stroke-width="2"/>

  <g font-family="IBM Plex Mono, Menlo, monospace" font-size="25">
