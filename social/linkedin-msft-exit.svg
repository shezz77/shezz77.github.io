    <text x="80" y="372">UNDER 3,000</text>
    <text x="80" y="482"><tspan fill="#E8663C">EXPECTED TO GO.</tspan></text>
  </g>

  <g font-family="Archivo, Helvetica, sans-serif" font-weight="900" font-size="66" letter-spacing="-2" fill="#E0A458">
